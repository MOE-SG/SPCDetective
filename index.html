<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCA Toolkit</title>
<style>
:root{
  --ink:#14213d; --ink2:#3e4a63; --mute:#6b7487; --line:#dce1e9; --line2:#eceff4;
  --bg:#f3f5f8; --card:#fff; --acc:#2563eb; --acc-bg:#eaf1fe;
  --ok:#15803d; --ok-bg:#e9f7ee; --bad:#c2410c; --bad-bg:#fdf0e8; --red:#dc2626;
  --fw:#3046b8; --fw-bg:#eef1fd; --qc:#0f766e; --qc-bg:#e6f5f3; --rc:#b45309; --rc-bg:#fdf3e5; --sol:#7c3aed; --sol-bg:#f3edfe;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:54px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.brand .mk{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#0f766e);display:grid;place-items:center;font:700 12px var(--mono)}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.7}
.sp{flex:1}
.tb{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.12)}
.menu{display:none}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 54px)}
.side{background:#fff;border-right:1px solid var(--line);padding:10px 8px 30px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.nav-home{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer;font-weight:600}
.nav-home:hover,.ni:hover{background:var(--bg)}
.nav-home.on,.ni.on{background:var(--acc-bg);color:#123c86}
.ncat{margin:14px 10px 4px;font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.ncat i{width:9px;height:9px;border-radius:3px;display:inline-block}
.ni{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;cursor:pointer}
.ni .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ni .st{margin-left:auto;font-size:10px;color:var(--mute)}
.ni .st.done{color:var(--ok)}

main{padding:18px 20px 40px;min-width:0}
.wrap{max-width:1320px;margin:0 auto}

/* ---------- home ---------- */
.hero h1{margin:0 0 4px;font-size:24px}
.hero p{margin:0 0 16px;color:var(--ink2);max-width:880px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel>h2{margin:0 0 4px;font-size:17px}
.panel>.sub{margin:0 0 12px;color:var(--mute);font-size:13px}
.ig{display:grid;grid-template-columns:120px repeat(4,minmax(0,1fr));gap:6px;align-items:stretch}
.ig .ch{border-radius:8px;padding:10px;color:#fff;font-weight:700;font-size:13.5px;line-height:1.25;position:relative}
.ig .ch small{display:block;font-weight:400;opacity:.85;font-size:11.5px;margin-top:2px}
.ig .ch:after{content:"";position:absolute;right:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left-color:inherit;border-right:0;z-index:2}
.ig .ch.c1{background:#1e3a8a;border-color:#1e3a8a}.ig .ch.c2{background:#1d4ed8;border-color:#1d4ed8}.ig .ch.c3{background:#2563eb;border-color:#2563eb}.ig .ch.c4{background:#3b82f6;border-color:#3b82f6}
.ig .ch.c4:after{display:none}
.ig .rl{font-weight:700;font-size:12.5px;display:flex;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer}
.ig .rl:hover{background:var(--fw-bg)}
.ig .rl small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.ig .ph{background:var(--fw-bg);border:1px solid #cdd5f6;color:#1d2b7a;border-radius:7px;padding:7px 9px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center}
.ig .ph:hover{border-color:var(--fw)}
.ig .tcell{background:#fafbfd;border:1px dashed var(--line);border-radius:8px;padding:7px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:14px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;white-space:nowrap}
.chip:hover{filter:brightness(.96);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chip.fw{color:var(--fw);border-color:#c3ccf3;background:var(--fw-bg)}
.chip.qc{color:var(--qc);border-color:#a9dcd5;background:var(--qc-bg)}
.chip.rc{color:var(--rc);border-color:#f0cf9f;background:var(--rc-bg)}
.chip.sol{color:var(--sol);border-color:#d6c3fb;background:var(--sol-bg)}
.chip .n{font:700 10px var(--mono);opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.catc{border-radius:10px;padding:12px 14px;border:1px solid;background:#fff}
.catc h3{margin:0;font-size:15px}
.catc .q{font-style:italic;font-size:13px;margin:2px 0 6px}
.catc p{margin:0 0 8px;font-size:12.8px;color:var(--ink2)}
.catc .chips{display:flex;flex-wrap:wrap;gap:5px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain .ar{color:var(--mute);font-weight:700}
.chain .step{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.chain .step small{font-size:11px;color:var(--mute);max-width:130px;line-height:1.25}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
.pick div{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line2);padding:6px 2px;font-size:13px}
.fwpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fwpick div{border:1px solid #cdd5f6;background:var(--fw-bg);border-radius:9px;padding:10px 12px;font-size:12.8px;cursor:pointer}
.fwpick div b{display:block;color:var(--fw);font-size:14px}

/* ---------- tool view ---------- */
.thead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.thead .big{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.thead h1{margin:0;font-size:22px;line-height:1.2}
.thead .meta{color:var(--ink2);font-size:13.5px;margin-top:2px}
.tag{display:inline-block;font:700 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-right:6px;vertical-align:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid #c3cad6;background:#fff;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--ink)}
.btn:hover{background:#f4f6f9}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#1d4fc4}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);background:var(--bg)}
.tgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.guide{margin-bottom:14px}
.guide summary{cursor:pointer;padding:11px 16px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
.guide summary::-webkit-details-marker{display:none}
.guide summary:before{content:"▸";color:var(--mute);transition:transform .15s}
.guide[open] summary:before{transform:rotate(90deg)}
.guide .gb{padding:0 16px 14px;font-size:13.3px;color:var(--ink2)}
.guide .gb h4{margin:10px 0 4px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.guide ol,.guide ul{margin:0;padding-left:20px}
.guide li{margin:2px 0}
.guide .what{font-size:14px;color:var(--ink)}

.chat{padding:14px 14px 6px}
.chat h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.chat h3 .prog{margin-left:auto;font:600 11.5px var(--sans);text-transform:none;letter-spacing:0}
.msg{display:flex;gap:9px;margin-bottom:10px}
.msg .av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 11px var(--mono);color:#fff}
.msg.bot .av{background:var(--ink)}
.msg .bub{border-radius:4px 12px 12px 12px;padding:9px 12px;background:var(--bg);max-width:100%;min-width:0}
.msg.bot .bub b.q{display:block}
.msg .help{font-size:12.5px;color:var(--mute);margin-top:3px}
.msg.user{justify-content:flex-end}
.msg.user .bub{background:var(--acc-bg);border-radius:12px 4px 12px 12px;color:#102c62;position:relative;max-width:88%}
.msg.user .edit{font-size:11.5px;color:var(--acc);cursor:pointer;margin-left:8px;font-weight:600;white-space:nowrap}
.msg.user .bub ul{margin:0;padding-left:18px}
.phase{display:inline-block;font:700 10.5px var(--mono);background:var(--fw);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.sugg{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--mute)}
.inbox{border:1.5px solid var(--acc);border-radius:10px;padding:10px;background:#fff;margin:2px 0 12px 37px}
.inbox .inp,.inbox textarea,.inbox select{width:100%;border:1px solid #c6cdd8;border-radius:6px;padding:7px 9px;background:#fff}
.inbox textarea{min-height:90px;resize:vertical}
.inbox .inp:focus,.inbox textarea:focus,.inbox select:focus{outline:2px solid #a8c3f3;border-color:var(--acc)}
.inbox .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.inbox .hint{font-size:11.5px;color:var(--mute);flex:1;min-width:140px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1.5px solid #c6cdd8;border-radius:8px;padding:7px 12px;background:#fff;cursor:pointer;font-weight:600;text-align:left}
.choice:hover{border-color:var(--acc)}
.choice.on{border-color:var(--acc);background:var(--acc-bg)}
.choice small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.etbl{width:100%;border-collapse:collapse;font-size:13px}
.etbl th{background:#f5f7fa;text-align:left;font-size:11.5px;color:var(--ink2);padding:5px 6px;border:1px solid var(--line2);white-space:nowrap}
.etbl td{border:1px solid var(--line2);padding:2px}
.etbl td input,.etbl td select{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 6px;background:transparent;min-width:60px}
.etbl td input:hover,.etbl td select:hover{border-color:#c6cdd8}
.etbl td input:focus,.etbl td select:focus{outline:2px solid #a8c3f3;background:#fff}
.etbl td.ro{padding:5px 8px;font-weight:600;background:#fafbfc}
.etbl td.x{width:28px;text-align:center}
.tscroll{overflow-x:auto}
.xb{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;padding:3px 6px}
.xb:hover{color:var(--red)}
.mt{width:100%;border-collapse:collapse;font-size:12.3px;margin-top:2px}
.mt th,.mt td{border:1px solid #cfdcf3;padding:3px 6px;text-align:left;vertical-align:top}
.mt th{background:#dce8fb;font-weight:600}
.start{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px 37px}

.rcol{position:sticky;top:70px}
.out{padding:14px 16px 16px}
.out h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:40px 16px;text-align:center;color:var(--mute);font-size:13.5px}
svg.chart{width:100%;height:auto;display:block}
svg .grid line{stroke:#e8ebf0}
svg .ax{stroke:#8b93a3;stroke-width:1}
svg .tk{font-size:11px;fill:#5d6577}
svg .al{font-size:11.5px;fill:#3e4a63;font-weight:600}
svg text{font-family:var(--sans)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fafbfd}
.kpi b{display:block;font-size:17px}
.kpi span{font-size:11.5px;color:var(--mute)}
.find{border-left:4px solid var(--acc);background:var(--acc-bg);padding:9px 12px;border-radius:0 8px 8px 0;margin-top:10px;font-size:13.3px;color:#14315f}
.find.warn{border-color:var(--bad);background:var(--bad-bg);color:#6b2a06}
.find.good{border-color:var(--ok);background:var(--ok-bg);color:#14532d}
.find ul{margin:4px 0 0;padding-left:18px}
.rt{width:100%;border-collapse:collapse;font-size:12.8px;margin-top:10px}
.rt th,.rt td{border:1px solid var(--line2);padding:5px 8px;text-align:left;vertical-align:top}
.rt th{background:#f5f7fa;font-size:11.5px;color:var(--ink2)}
.rt td.n,.rt th.n{text-align:right;font-variant-numeric:tabular-nums}
.rt tr.hi td{background:#fff8e6}
.t5{text-decoration:line-through;letter-spacing:-1px;margin-right:4px}
.tally{font-family:var(--mono);color:#334155;font-size:12px}
.nextt{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mute)}
.svscroll{overflow-x:auto}
.svscroll svg{min-width:var(--minw,0)}

/* 5-why */
.wchain{display:flex;flex-direction:column;align-items:stretch;gap:0}
.wbox{border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;position:relative}
.wbox .lb{font:700 10.5px var(--mono);color:var(--mute);letter-spacing:.05em}
.wbox.prob{border-color:#f3b4a0;background:#fff5f1}
.wbox.root{border-color:#8fd0a8;background:var(--ok-bg)}
.warr{text-align:center;color:var(--mute);font-size:12px;line-height:1.1;padding:3px 0}
.warr b{display:block;font-size:15px}

/* window grid */
.wgrid{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:4px;font-size:12.5px}
.wgrid .h{background:#f1f4f8;border-radius:6px;padding:6px 8px;font-weight:700;color:var(--ink2);font-size:12px}
.wgrid .c{border-radius:7px;padding:7px 8px;min-height:78px;border:1.5px solid}
.wgrid .c .L{font:800 15px var(--mono)}
.wgrid .c .d{font-size:11px;opacity:.85}
.wgrid .dot{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:#14213d;color:#fff;font:700 11px var(--mono);margin:3px 3px 0 0;padding:0 5px}
.cA{background:#ecf8f0;border-color:#9fd8b2;color:#14532d}
.cB{background:#fff6e5;border-color:#f3cf86;color:#6b4300}
.cC{background:#eaf1fe;border-color:#a9c4f5;color:#173a7a}
.cD{background:#fdeeee;border-color:#f3b0b0;color:#7a1414}
.cell-badge{display:inline-block;font:800 12px var(--mono);border-radius:5px;padding:1px 7px;border:1.5px solid}

.wtab{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;table-layout:fixed}
.wtab th{background:#eef1f5;color:#3e4a63;font-weight:600;padding:5px 6px;border:1px solid #c3cad5;text-align:center;line-height:1.25}
.wtab td{border:1px solid #c3cad5;padding:6px 4px;vertical-align:top;height:78px;text-align:center}
.wtab td .L{font:800 22px var(--sans);line-height:1.1;color:#1f2937}
.wtab td .d{font-size:10.5px;color:#374151;opacity:.85;margin-bottom:2px}
.wtab td.hit{box-shadow:inset 0 0 0 3px #dc2626}
.wtab .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;padding:2px 0;white-space:nowrap}
.wtab .corner{background:linear-gradient(to top right,#eef1f5 49.4%,#c3cad5 50%,#eef1f5 50.6%);text-align:left;font-weight:700}
.kA{background:#bfe5c6;border-color:#7cc68b!important}.kB{background:#dde3da;border-color:#a9b5a4!important}.kC{background:#ddc9ee;border-color:#b69ad3!important}.kD{background:#f6c8a5;border-color:#e09a62!important}
.cell-badge.kA,.cell-badge.kB,.cell-badge.kC,.cell-badge.kD{color:#1f2937}
.mk{display:inline-block;margin:2px;padding:1px 7px;border-radius:9px;background:#14213d;color:#fff;font:700 10.5px var(--mono)}
.mk.main{background:#dc2626}
.credit{max-width:1320px;margin:22px auto 0;padding:12px 4px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}
.credit a{color:inherit}
.hcred{display:flex;flex-wrap:wrap;gap:8px 18px;margin:-6px 0 16px;font-size:13px;color:var(--ink2)}
.hcred span{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 12px}
@media print{.credit{position:fixed;bottom:0;left:0;right:0;margin:0;padding:3px 0 0;font-size:8pt;background:#fff}}
.igm,.mob,.sidefile{display:none}
.sidefile{gap:6px;margin:16px 10px 0;padding-top:12px;border-top:1px solid var(--line)}
.igs{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.igs .ch{border-radius:0;padding:9px 12px;color:#fff;font-weight:700;font-size:14px}
.igs .ch small{display:block;font-weight:400;opacity:.85;font-size:12px}
.igs .ch.c1{background:#1e3a8a}.igs .ch.c2{background:#1d4ed8}.igs .ch.c3{background:#2563eb}.igs .ch.c4{background:#3b82f6}
.igb{padding:8px 10px 10px}
.igr{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.igr b{color:var(--fw)}
.igr span{color:#1d2b7a}
.igt{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.igarr{text-align:center;color:#94a3b8;font-size:13px;line-height:1;padding:4px 0}
.cmvt{width:100%;min-width:640px;border-collapse:separate;border-spacing:3px;font-size:12px;table-layout:fixed}
.cmvt th{background:#14213d;color:#fff;border-radius:6px;padding:6px 4px;font-size:12px}
.cmvt th .ic{display:block;font-size:16px;line-height:1.2}
.cmvt th.rh{writing-mode:vertical-rl;transform:rotate(180deg);width:30px;padding:6px 2px}
.cmvt th.rhV{background:#0f766e}.cmvt th.rhM{background:#b45309}.cmvt th.rhC{background:#7c3aed}
.cmvt tr>th:first-child{width:34px}
.cmvt td{background:#f5f7fa;border:1px solid #dbe1e9;border-radius:6px;padding:5px;vertical-align:top;min-height:60px}
.cmvt td.has{background:#fff;border-color:#94a3b8}
.cmvt td.n,.cmvt th.n{text-align:center;width:46px}
.cmvt .cc{background:#eef2f7;border-radius:4px;padding:3px 5px;margin-bottom:3px;line-height:1.3}
.cmvt .cc.v{background:#fde8e8;color:#b91c1c;font-weight:700}
.cmvt .ex{color:#94a3b8;font-style:italic;font-size:11px;line-height:1.3}
.iwm{border-collapse:collapse;font-size:12.5px;min-width:100%}
.iwm th,.iwm td{border:1px solid #c3cad5;padding:4px 8px;text-align:center}
.iwm tr:first-child th{background:#f1f4f8;font-weight:600}
.iwm tr.wt td{background:#d9e66b;font-weight:600}
.iwm tr.rt2 td{color:#475569;background:#fafbfc}
.iwm td.tot{font-weight:700;background:#f1f4f8}
.iwm td.rk{font-weight:800;background:#f3d3c4;color:#7c2d12;font-size:14px}
.iwm td.rk.top{background:#fbbf9b}
.iwm th[rowspan]{background:#f1f4f8}
.picks{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.pk{display:flex;align-items:center;gap:8px;border:1.5px solid #d4dae3;border-radius:7px;padding:6px 10px;cursor:pointer;background:#fff}
.pk:hover{border-color:var(--acc)}
.pk:has(input:checked){border-color:#dc2626;background:#fff1f1;color:#991b1b;font-weight:600}
.pk small{margin-left:auto;color:var(--mute);font-weight:400;font-size:11px}
.pk input{accent-color:#dc2626;width:16px;height:16px}
.etbl td.rn{width:34px;text-align:center;color:#334155;background:#eef2f7;font:700 12px var(--mono)}
.pickl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.pq{border:1.5px solid;border-radius:9px;padding:8px 10px;font-size:12.8px}
.pqh{font-weight:800;font-size:14px}.pqh span{font-weight:600;opacity:.8}
.pqd{color:var(--ink2);font-size:12px;margin:1px 0 4px}
.pq ol{margin:0;padding-left:24px}.pq li{margin:2px 0}.pq li small{color:var(--mute)}
@media (max-width:820px){.pickl{grid-template-columns:1fr}}
/* framework report */
.fwrep{display:grid;gap:10px}
.fwp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fwp .fh{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--fw-bg);font-weight:700;color:#1d2b7a;font-size:13.5px}
.fwp .fh .pc{margin-left:auto;font:600 11px var(--sans);color:var(--mute)}
.fwp .fb{padding:6px 12px 10px;font-size:13px}
.fwp .fb .qa{margin-top:6px}
.fwp .fb .qa b{display:block;font-size:11.5px;color:var(--mute);font-weight:600}
.fwp .fb .qa .v{white-space:pre-wrap}
.fwp.empty-p .fh{background:#f4f5f8;color:var(--mute)}
.pbar{display:flex;gap:3px;margin:4px 0 10px}
.pbar span{flex:1;height:7px;border-radius:4px;background:#e3e7ee}
.pbar span.on{background:var(--fw)}

dialog#full{border:0;border-radius:12px;padding:0;width:min(1400px,96vw);max-height:94vh;box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog#full::backdrop{background:rgba(15,25,45,.55)}
dialog#full .fhd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
dialog#full .svscroll svg{min-width:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
#toast.show{opacity:1}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s 2}

@media (max-width:1100px){ .tgrid{grid-template-columns:1fr} .rcol{position:static} .cats,.fwpick{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:1fr} .side{position:fixed;left:0;top:54px;width:270px;z-index:25;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.12)}
  .side.open{transform:none} .menu{display:inline-block}
  .igwrap,.dsk{display:none} .igm,.mob{display:block}
  .tb{padding:5px 8px;font-size:12.5px} .brand small{display:none} .brand{font-size:13.5px;white-space:normal;line-height:1.15} .top{gap:6px;padding:8px 10px}
  #bExport,#bImport{display:none} .sidefile{display:flex}
  .panel{padding:14px 12px} .hero h1{font-size:21px}
  .thead .acts{margin-left:0;width:100%} .thead .acts .btn{flex:1 1 auto}
  .cats,.pick,.fwpick{grid-template-columns:1fr} main{padding:14px 12px 30px}
  .inbox{margin-left:0}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11pt}
  .top,.side,.acts,.inbox,.start,.msg .edit,.sugg,.nextt,.tb,#toast,.btn{display:none!important}
  .app{display:block} main{padding:0}
  .tgrid{display:block} .rcol{position:static;margin-top:10px}
  .card,.panel{border:0;box-shadow:none} .guide{display:block} .guide .gb{display:block}
  .msg,.wbox,.fwp,svg,.rt tr,.catc{break-inside:avoid}
  .chip{border-width:1px}
  .ig .ch:after{display:none}
}

<body>
<header class="top">
  <button class="tb menu" id="bMenu" aria-label="Menu">☰</button>
  <div class="brand" data-go="home"><div class="mk">RCA</div><div>Root Cause Analysis Toolkit<small>Frameworks · 7 QC tools · RCA methods</small></div></div>
  <div class="sp"></div>
  <button class="tb" id="bExport" title="Save all your entries to a file">Save all</button>
  <button class="tb" id="bImport" title="Load entries from a file">Open</button>
  <button class="tb" id="bPrint" title="Print or save as PDF">Print / PDF</button>
</header>
<div class="app">
  <aside class="side" id="side"></aside>
  <main><div class="wrap" id="view"></div><footer class="credit">Developed by <b>Soe Moe</b> · <a href="mailto:soe.moe@halliburton.com">soe.moe@halliburton.com</a> &nbsp;|&nbsp; Course conductor: <b>Chang Keen Weng</b> (ACT, QC Tools)</footer></main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast"></div>
<dialog id="full"><div class="fhd"><b id="fullT"></b><button class="btn sm" data-act="closefull">Close</button></div><div id="fullB" class="out"></div></dialog>
<script>
"use strict";
/* ===================== utilities ===================== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => (v === "" || v === null || v === undefined) ? NaN : Number(String(v).trim());
function parseNums(s){ if(Array.isArray(s)) return s.map(Number).filter(Number.isFinite);
  return String(s||"").split(/[\s,;]+/).filter(x=>x!=="").map(Number).filter(Number.isFinite); }
const sum = a => a.reduce((x,y)=>x+y,0);
const mean = a => a.length ? sum(a)/a.length : NaN;
function sd(a){ if(a.length<2) return NaN; const m=mean(a); return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1)); }
function fmtN(v){ if(!Number.isFinite(v)) return "–"; const a=Math.abs(v);
  if(a>=1000) return v.toFixed(0); if(a>=100) return String(+v.toFixed(1)); if(a>=1) return String(+v.toFixed(2)); if(a===0) return "0"; return String(+v.toPrecision(3)); }
const pct = (v,d=1) => Number.isFinite(v) ? (v*100).toFixed(d)+"%" : "–";
function niceTicks(lo,hi,n=5){
  if(!Number.isFinite(lo)||!Number.isFinite(hi)){ lo=0; hi=1; }
  if(hi<=lo){ hi=lo+(Math.abs(lo)||1)*0.1; lo=lo-(Math.abs(lo)||1)*0.1; }
  const st0=(hi-lo)/n, mag=10**Math.floor(Math.log10(st0)), r=st0/mag, step=(r<1.5?1:r<3?2:r<7?5:10)*mag;
  const a=Math.floor(lo/step+1e-9)*step, b=Math.ceil(hi/step-1e-9)*step, t=[];
  for(let v=a; v<=b+step*1e-6; v+=step) t.push(+v.toFixed(12));
  return t.length>1 ? t : [a, a+step];
}
function wrap(s,n){ const w=String(s||"").split(/\s+/).filter(Boolean), out=[]; let l="";
  w.forEach(x=>{ if((l+" "+x).trim().length>n && l){ out.push(l); l=x; } else l=(l+" "+x).trim(); });
  if(l) out.push(l); return out.length?out:[""]; }
function clip(lines,max){ if(lines.length<=max) return lines; const o=lines.slice(0,max); o[max-1]=o[max-1].replace(/.{0,2}$/,"")+"…"; return o; }
const T = (x,y,s,a="") => `<text x="${x}" y="${y}" ${a}>${esc(s)}</text>`;
const TL = (x,y,lines,lh,a="") => `<text x="${x}" y="${y}" ${a}>${lines.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join("")}</text>`;
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function normals(seed,n,m,s,dp){ const r=rng(seed), out=[]; while(out.length<n){ const u=Math.max(r(),1e-9), v=r(); out.push(+(m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)).toFixed(dp)); } return out; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
const EMPTY = m => `<div class="empty">${m||"Your result builds here as you answer the questions."}</div>`;
const rows = v => Array.isArray(v) ? v : [];
const filled = r => Object.values(r||{}).some(x=>String(x??"").trim()!=="");
const PAL = ["#2563eb","#f59e0b","#0f766e","#dc2626","#7c3aed","#0891b2","#65a30d","#db2777","#64748b","#ea580c"];

/* ===================== registry ===================== */
const CATS = {
  fw: {name:"Problem-solving frameworks", short:"Framework", color:"var(--fw)", bg:"var(--fw-bg)",
       q:"Which steps do we follow, in what order?",
       desc:"Roadmaps that structure the whole investigation from problem to permanent fix. Pick one per problem; the tools below plug into its phases."},
  qc: {name:"7 QC tools", short:"7 QC tool", color:"var(--qc)", bg:"var(--qc-bg)",
       q:"What do the facts and data say?",
       desc:"Ishikawa's basic tools for exposing the problem with data: where, how often, how big, and whether the process changed. Fishbone also starts the cause search."},
  rc: {name:"Root-cause methods", short:"RCA method", color:"var(--rc)", bg:"var(--rc-bg)",
       q:"Why did it really happen?",
       desc:"Methods that drill from the symptom to the cause you can act on: a single chain (5-Why), combined causes (Fault tree), or people and standards (Window analysis)."},
  sol: {name:"Solution & change tools", short:"Change tool", color:"var(--sol)", bg:"var(--sol-bg)",
       q:"Will the fix be accepted and stick?",
       desc:"Tools for deciding and implementing the countermeasure: weigh what pushes the change forward against what holds it back."}
};
const TOOLS = {}, TOOL_ORDER = [];
function tool(t){ TOOLS[t.id]=t; TOOL_ORDER.push(t.id); }
const chipOf = (id,extra="") => { const t=TOOLS[id]; return t ? `<span class="chip ${t.cat}" data-open="${id}" title="${esc(t.short)}">${esc(t.icon)} ${esc(t.name)}${extra}</span>` : ""; };

/* ===================== chart frame ===================== */
function plot(o){
  const W=o.W||640, H=o.H||330, L=o.L??58, R=o.R??24, Tp=o.T??16, B=o.B??52, pw=W-L-R, ph=H-Tp-B;
  const yt=o.yticks||niceTicks(o.ymin,o.ymax,5), y0=yt[0], y1=yt[yt.length-1];
  const sy=v=>Tp+ph-(v-y0)/(y1-y0)*ph;
  let sx, xt=null, bw=0;
  if(o.cats){ bw=pw/Math.max(1,o.cats.length); sx=i=>L+bw*(i+.5); }
  else { xt=o.xticks||niceTicks(o.xmin,o.xmax,6); const x0=o.xdom?o.xdom[0]:xt[0], x1=o.xdom?o.xdom[1]:xt[xt.length-1]; sx=v=>L+(v-x0)/(x1-x0)*pw; }
  let g=`<g class="grid">`;
  yt.forEach(v=>{ g+=`<line x1="${L}" x2="${L+pw}" y1="${sy(v)}" y2="${sy(v)}"/>`; });
  g+=`</g>`;
  yt.forEach(v=>{ g+=T(L-7,sy(v)+4,(o.yfmt||fmtN)(v),'text-anchor="end" class="tk"'); });
  if(xt) xt.forEach(v=>{ g+=T(sx(v),Tp+ph+17,(o.xfmt||fmtN)(v),'text-anchor="middle" class="tk"'); });
  if(o.cats) o.cats.forEach((c,i)=>{ g+=TL(sx(i),Tp+ph+16,clip(wrap(c,Math.max(5,Math.floor(bw/6.3))),2),12,'text-anchor="middle" class="tk"'); });
  g+=`<line class="ax" x1="${L}" x2="${L+pw}" y1="${Tp+ph}" y2="${Tp+ph}"/><line class="ax" x1="${L}" x2="${L}" y1="${Tp}" y2="${Tp+ph}"/>`;
  if(o.xlabel) g+=T(L+pw/2,H-5,o.xlabel,'text-anchor="middle" class="al"');
  if(o.ylabel) g+=T(13,Tp+ph/2,o.ylabel,`text-anchor="middle" class="al" transform="rotate(-90 13 ${Tp+ph/2})"`);
  return {W,H,L,R,T:Tp,B,pw,ph,sx,sy,bw,g,y0,y1,xt,open:`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" xmlns="http://www.w3.org/2000/svg">`};
}
const kpi = (v,l) => `<div class="kpi"><b>${v}</b><span>${esc(l)}</span></div>`;
function miniTable(cols, data){ return `<table class="rt"><tr>${cols.map(c=>`<th${c.n?' class="n"':""}>${esc(c.l)}</th>`).join("")}</tr>${data.map(r=>`<tr${r._hi?' class="hi"':""}>${cols.map(c=>`<td${c.n?' class="n"':""}>${c.html?r[c.k]:esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</table>`; }

/* ===================== FRAMEWORKS ===================== */
function fwReport(t,a){
  const steps=vis(t,a), any=steps.some(s=>!isEmptyVal(s,a[s.id],a));
  if(!any) return EMPTY("Your phase-by-phase report builds here as you answer.");
  let bar=`<div class="pbar">`, body=`<div class="fwrep">`;
  t.phases.forEach(p=>{
    const ss=steps.filter(s=>s.phase===p.k), done=ss.filter(s=>!isEmptyVal(s,a[s.id],a));
    bar+=`<span class="${done.length&&done.length===ss.filter(s=>!s.optional).length?"on":""}" title="${esc(p.k+" · "+p.n)}"></span>`;
    const tools=[...new Set(ss.flatMap(s=>s.tools||[]))];
    body+=`<div class="fwp${done.length?"":" empty-p"}"><div class="fh"><span class="phase">${esc(p.k)}</span>${esc(p.n)}<span class="pc">${done.length}/${ss.length}</span></div><div class="fb">`;
    body+= done.length ? done.map(s=>`<div class="qa"><b>${esc(s.label||qText(s,a))}</b><div class="v">${fmtAns(s,a[s.id],a)}</div></div>`).join("") : `<div style="color:var(--mute);font-size:12.5px;margin-top:4px">${esc(p.d)}</div>`;
    if(tools.length) body+=`<div class="sugg">Tools: ${tools.map(x=>chipOf(x)).join("")}</div>`;
    body+=`</div></div>`;
  });
  return bar+`</div>`+body+`</div>`;
}
function fwTool(o){ tool(Object.assign({cat:"fw", resultLabel:"Phase report", render(a){ return fwReport(this,a); }}, o)); }
const CM_COLS=[{k:"a",l:"Action",w:220},{k:"o",l:"Owner",w:90},{k:"d",l:"Due",w:70},{k:"s",l:"Status",type:"select",opts:["","Open","In progress","Done"]}];

/* ---------- EAS ---------- */
fwTool({id:"eas", icon:"E", name:"EAS", intro:"Let's work the problem with EAS: Expose, Analyze, Solve.",
  short:"Expose the problem, Analyze the problem, Solve the problem: a simple three-stage roadmap for everyday problems.",
  phases:[{k:"E",n:"Expose the problem",d:"Make the problem visible and measurable."},{k:"A",n:"Analyze the problem",d:"Find and verify the root cause."},{k:"S",n:"Solve the problem",d:"Fix it, prove the fix, and standardize."}],
  guide:{what:"A three-stage problem-solving roadmap that is easy for any team to remember and follow.",
    when:["Everyday shop-floor and process problems.","When the team is new to structured problem solving.","When a full 8D or DMAIC would be too heavy."],
    steps:["<b>Expose:</b> describe the problem with facts and data; contain it if customers are at risk.","<b>Analyze:</b> list possible causes, then find and verify the root cause.","<b>Solve:</b> implement countermeasures, show they work, and standardize them."],
    tips:["EAS has no named 'verify' step: build it into Solve, or the fix may not be proven.","Use the 7 QC tools in Expose, the root-cause methods in Analyze."]},
  related:["checksheet","pareto","fivewhy","forcefield"],
  sampleNote:"The J3 cracked-joint problem worked through EAS.",
  steps:[
    {id:"e_prob",phase:"E",label:"Problem",q:"Describe the problem: what, where, when, and how many.",type:"textarea",tools:["checksheet","pareto"]},
    {id:"e_data",phase:"E",label:"Data",q:"What data shows how big the problem is and where it concentrates?",type:"textarea",tools:["pareto","stratification","controlchart"]},
    {id:"e_impact",phase:"E",label:"Impact",q:"What is the impact (customer, cost, safety)?",type:"text",optional:1},
    {id:"e_contain",phase:"E",label:"Containment",q:"What have you done to protect the customer during the investigation?",type:"textarea",optional:1},
    {id:"a_causes",phase:"A",label:"Possible causes",q:"List the possible causes you considered.",type:"list",tools:["fishbone","flowchart"]},
    {id:"a_root",phase:"A",label:"Root cause",q:"What is the verified root cause?",type:"textarea",tools:["fivewhy","window","fta"]},
    {id:"a_verify",phase:"A",label:"Verification",q:"How did you verify it?",type:"textarea",tools:["scatter","stratification"]},
    {id:"s_cm",phase:"S",label:"Countermeasures",q:"What countermeasures will you put in place?",type:"table",cols:CM_COLS,tools:["forcefield","window"]},
    {id:"s_result",phase:"S",label:"Result",q:"What result shows the fix works?",type:"textarea",tools:["controlchart","pareto"]},
    {id:"s_std",phase:"S",label:"Standardized",q:"What was standardized so the fix stays (WI, FMEA, control plan, training)?",type:"list"}
  ],
  sample:{e_prob:"J3 connector open / cracked solder joint is the top final-test failure: 23 of 47 failures in week 44 (49%), rising from Wednesday.",
    e_data:"Check sheet and Pareto: J3 = 49% of failures. Stratification: 21 of 23 J3 failures from night-shift operator D (20% rate vs under 1% for others).",
    e_impact:"Rework cost, schedule risk, and two field returns for intermittent J3 opens.",
    e_contain:"100% J3 wiggle test on WIP and finished stock; 4 more suspects quarantined.",
    a_causes:["No back-support fixture at night-shift bench 2","Operator not trained on WI step 14","Thin solder fillet","Final test misses intermittent opens"],
    a_root:"Board flex during J3 mating without the support fixture. The operator was transferred without line-specific WI training, and fixture use relies on memory.",
    a_verify:"Strain gauge: 1,100 µε without fixture vs 250 µε with. 3 boards mated without fixture cracked after 200 thermal cycles; 0 of 3 with fixture.",
    s_cm:[{a:"Fixture at bench 2 + shadow board",o:"Mfg Eng",d:"Wk 46",s:"Done"},{a:"Training sign-off in line-transfer checklist",o:"Prod Supv",d:"Wk 47",s:"In progress"},{a:"Fixture interlock + WI photo",o:"Mfg Eng",d:"Wk 48",s:"Open"}],
    s_result:"J3 failures fell from 23/week to 1 in weeks 47–50; idle-current control chart back in control.",
    s_std:["WI step 14 rev D with photo","Line-transfer checklist rev B","PFMEA updated: flex at mating, detection by wiggle test"]}
});

/* ---------- PDCA ---------- */
fwTool({id:"pdca", icon:"↻", name:"PDCA", intro:"Let's run a Plan–Do–Check–Act cycle.",
  short:"Plan, Do, Check, Act: a short improvement cycle you repeat until the target is met.",
  phases:[{k:"P",n:"Plan",d:"Understand the problem and cause; set a target and plan."},{k:"D",n:"Do",d:"Implement the plan, ideally as a small pilot."},{k:"C",n:"Check",d:"Compare the results with the target."},{k:"A",n:"Act",d:"Standardize what worked, or adjust and run another cycle."}],
  guide:{what:"The Deming cycle. Each turn of the wheel tests one change on a small scale, learns from the result, and either standardizes it or tries again.",
    when:["Small to medium improvements.","When you want to test an idea quickly before rolling it out.","As the continuous-improvement loop after a bigger project."],
    steps:["<b>Plan:</b> define the problem, the target, the root cause and the actions.","<b>Do:</b> carry out the plan, preferably as a pilot.","<b>Check:</b> measure the result against the target.","<b>Act:</b> standardize if it worked; otherwise adjust and start the next cycle."],
    tips:["Most teams under-invest in Plan. A good root cause there saves cycles later.","Check with data, not impressions."]},
  related:["pareto","fishbone","controlchart"],
  sampleNote:"A PDCA pilot of the J3 fixture interlock on night shift.",
  steps:[
    {id:"p_prob",phase:"P",label:"Problem / current state",q:"What is the problem and the current state?",type:"textarea",tools:["checksheet","pareto"]},
    {id:"p_target",phase:"P",label:"Target",q:"What is the target, and by when?",type:"text"},
    {id:"p_cause",phase:"P",label:"Root cause",q:"What is the root cause?",type:"textarea",tools:["fishbone","fivewhy"]},
    {id:"p_plan",phase:"P",label:"Action plan",q:"What is the plan?",type:"table",cols:CM_COLS,tools:["forcefield"]},
    {id:"d_done",phase:"D",label:"Implemented",q:"What was implemented or piloted, where and when?",type:"textarea"},
    {id:"d_issues",phase:"D",label:"Issues during Do",q:"Any problems or deviations during implementation?",type:"textarea",optional:1},
    {id:"c_result",phase:"C",label:"Results vs target",q:"What are the results compared with the target?",type:"textarea",tools:["controlchart","pareto","histogram"]},
    {id:"c_met",phase:"C",label:"Target met?",q:"Was the target met?",type:"choice",opts:[["yes","Yes"],["partly","Partly"],["no","No"]]},
    {id:"a_act",phase:"A",label:"Decision",q:"What do you do next?",type:"choice",opts:[["std","Standardize and roll out"],["adjust","Adjust and run another cycle"],["stop","Abandon this change"]]},
    {id:"a_std",phase:"A",label:"Standardized / next cycle",q:a=>a.a_act==="adjust"?"What will you change in the next cycle?":"What will be standardized, and where else does it apply?",type:"list"}
  ],
  sample:{p_prob:"J3 cracked joints: 23 per week at final test, concentrated on night shift where fixture use is inconsistent.",
    p_target:"Fewer than 2 J3 failures per week by week 48",
    p_cause:"Fixture use depends on memory; bench 2 had no fixture and the transferred operator wasn't trained.",
    p_plan:[{a:"Pilot quick-clamp fixture with presence interlock on night-shift bench 2",o:"Mfg Eng",d:"Wk 46",s:"Done"},{a:"Brief night shift with FA crack photos",o:"Prod Supv",d:"Wk 46",s:"Done"}],
    d_done:"Interlock fixture piloted on bench 2, night shift, weeks 46–47 (210 boards).",
    d_issues:"Clamp sensor needed re-positioning on day 2; cycle time +15 s.",
    c_result:"0 J3 failures on 210 pilot boards (was 20% for this bench). Day shift unchanged at under 1%.",
    c_met:"yes", a_act:"std",
    a_std:["Roll out interlock fixtures to all 4 cable benches","WI step 14 rev D","Apply same fixture to J5 connector on sister PCBA"]}
});

/* ---------- DMAIC ---------- */
fwTool({id:"dmaic", icon:"Σ", name:"DMAIC", intro:"Let's work through DMAIC: Define, Measure, Analyze, Improve, Control.",
  short:"Define, Measure, Analyze, Improve, Control: the Six Sigma roadmap for chronic, data-heavy problems.",

/* ---------- Flowchart ---------- */
const FC_TYPES=[["start","Start"],["process","Process step"],["decision","Decision (Yes/No)"],["inspect","Inspection / test"],["delay","Wait / storage"],["end","End"]];
const FC_MARK=[["","—"],["create","Defect can be created"],["detect","Defect is detected"]];
tool({id:"flowchart", cat:"qc", icon:"⇩", name:"Flowchart",
  short:"Map the real process step by step, and see where a defect is created and where it is caught.",
  guide:{what:"A picture of the process as it is <b>actually</b> done: each step, decision, inspection and handoff in order.",
    when:["At the start, so everyone agrees on the process being investigated.","To find where in the process a defect can be created, and where it should be detected.","To spot handoffs between people or departments (candidates for Window analysis)."],
    steps:["Name the process and its start and end points.","Walk the floor and list each step in order; don't copy the work instruction blindly.","Mark decisions (Yes/No) and where the 'No' path goes.","Mark inspections and tests.","Mark where the defect can be created and where it is detected; look for gaps between them."],
    tips:["Map what really happens, then compare with the documented process.","A long gap between 'created' and 'detected' means the defect travels, and costs more, before anyone sees it."]},
  related:["checksheet","window","fishbone"],
  sampleNote:"Cable-mating station for the J3 connector, where the cracked joints are suspected to start.",
  resultLabel:"Process map",
  next:["checksheet","window"],
  steps:[
    {id:"name", q:"Which process are you mapping?", type:"text", ph:"e.g. J3 harness mating at cable station"},
    {id:"steps", q:"List the steps in order. For each Decision, give the step number the 'No' path goes to.", type:"table", minRows:5,
      help:"Mark where the defect can be created and where it is detected. Start/End steps are optional but help readers.",
      cols:[{k:"_n",l:"#",rownum:1},{k:"text",l:"Step description",w:220},{k:"type",l:"Type",type:"select",opts:FC_TYPES},{k:"no",l:"If No → step #",type:"number",w:70,stepref:1},{k:"mark",l:"Defect",type:"select",opts:FC_MARK}]},
    {id:"note", q:"Anything that differs from the written work instruction?", type:"textarea", optional:1, ph:"e.g. Night shift mates the cable on the bench mat, not in the fixture."}
  ],
  sample:{name:"J3 harness mating at cable station", steps:[
    {text:"PCBA received at cable station",type:"start"},
    {text:"Pick PCBA from kitting tray",type:"process"},
    {text:"Place PCBA in back-support fixture P/N 123-456",type:"process",mark:"create"},
    {text:"Mate harness to J3 connector",type:"process",mark:"create"},
    {text:"Visual check: J3 fully seated",type:"inspect"},
    {text:"Seated correctly?",type:"decision",no:"4"},
    {text:"Install PCBA into insert chassis",type:"process"},
    {text:"Final functional test incl. J3 continuity",type:"inspect",mark:"detect"},
    {text:"Test passed?",type:"decision",no:"11"},
    {text:"Release to tool assembly",type:"end"},
    {text:"Quarantine and send to FA",type:"end"}],
    note:"Night shift often mates the cable with the board flat on the bench mat because the fixture is slow to set up. A cracked joint can still pass final test if it is only intermittent."},
  render(a){
    const st=rows(a.steps).filter(r=>String(r.text||"").trim()); if(!st.length) return EMPTY();
    const cx=330, bw=250, gap=30, H0=20; let y=H0, g="", pos=[];
    st.forEach(r=>{ const h=r.type==="decision"?74:(r.type==="start"||r.type==="end")?40:50; pos.push({y,h,c:y+h/2}); y+=h+gap; });
    const W=700, H=y; const lanes={}; let lane=0;
    const shape=(r,p,i)=>{ const x=cx-bw/2, txt=clip(wrap(r.text, r.type==="decision"?24:34),2), lh=14, ty=p.c-(txt.length-1)*lh/2+4;
      let s; const mk=r.mark==="create"?"#dc2626":r.mark==="detect"?"#15803d":"#475569"; const fill=r.mark==="create"?"#fff5f3":r.mark==="detect"?"#effaf3":"#fff";
      if(r.type==="decision") s=`<polygon points="${cx},${p.y} ${cx+bw/2},${p.c} ${cx},${p.y+p.h} ${cx-bw/2},${p.c}" fill="#fffbea" stroke="#b45309" stroke-width="1.6"/>`;
      else if(r.type==="start"||r.type==="end") s=`<rect x="${x+30}" y="${p.y}" width="${bw-60}" height="${p.h}" rx="${p.h/2}" fill="#14213d"/>`;
      else if(r.type==="inspect") s=`<rect x="${x}" y="${p.y}" width="${bw}" height="${p.h}" rx="4" fill="${fill}" stroke="${mk}" stroke-width="1.6"/><rect x="${x+4}" y="${p.y+4}" width="${bw-8}" height="${p.h-8}" rx="3" fill="none" stroke="${mk}" stroke-width="1"/>`;
      else if(r.type==="delay") s=`<path d="M${x} ${p.y} H${x+bw-p.h/2} A${p.h/2} ${p.h/2} 0 0 1 ${x+bw-p.h/2} ${p.y+p.h} H${x} Z" fill="${fill}" stroke="${mk}" stroke-width="1.6"/>`;
      else s=`<rect x="${x}" y="${p.y}" width="${bw}" height="${p.h}" rx="6" fill="${fill}" stroke="${mk}" stroke-width="1.6"/>`;
      const col=(r.type==="start"||r.type==="end")?"#fff":"#14213d";
      s+=TL(cx,ty,txt,lh,`text-anchor="middle" font-size="12.5" font-weight="600" fill="${col}"`);
      s+=`<circle cx="${cx-bw/2-16}" cy="${p.c}" r="11" fill="#e2e8f0"/>`+T(cx-bw/2-16,p.c+4,String(i+1),'text-anchor="middle" font-size="11" font-weight="700" fill="#334155"');
      if(r.mark) s+=TL(cx-bw/2-34,p.c-3,r.mark==="create"?["Defect can","be created"]:["Defect","detected"],12,`text-anchor="end" font-size="11" font-weight="700" fill="${mk}"`);
      return s; };
    st.forEach((r,i)=>{ const p=pos[i];
      if(i<st.length-1 && r.type!=="end"){ g+=`<path d="M${cx} ${p.y+p.h} V${pos[i+1].y-2}" stroke="#64748b" stroke-width="1.6" marker-end="url(#fa)"/>`; if(r.type==="decision") g+=T(cx+8,p.y+p.h+16,"Yes",'font-size="11" font-weight="700" fill="#15803d"'); }
      if(r.type==="decision"){ const tgt=Math.round(num(r.no))-1; if(tgt>=0 && tgt<st.length && tgt!==i){ const lx=cx+bw/2+24+(lane++%5)*16, tp=pos[tgt];
        const ex = st[tgt].type==="decision" ? cx+bw/2 : (st[tgt].type==="start"||st[tgt].type==="end") ? cx+bw/2-30 : cx+bw/2;
        g+=`<path d="M${cx+bw/2} ${p.c} H${lx} V${tp.c} H${ex+3}" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#fb)"/>`+T(cx+bw/2+5,p.c-5,"No",'font-size="11" font-weight="700" fill="#b45309"'); } }
    });
    st.forEach((r,i)=>{ g+=shape(r,pos[i],i); });
    const svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs>${g}</svg>`;
    const cr=st.map((r,i)=>r.mark==="create"?i:-1).filter(i=>i>=0), dt=st.map((r,i)=>r.mark==="detect"?i:-1).filter(i=>i>=0), ins=st.filter(r=>r.type==="inspect").length;
    let f=[];

    f.push(`${st.length} steps, ${st.filter(r=>r.type==="decision").length} decisions, ${ins} inspection/test points.`);
    return `<div class="svscroll">${svg}</div><div class="find${cr.length&&!dt.length?" warn":""}"><ul>${f.map(x=>`<li>${x}</li>`).join("")}</ul></div>${a.note?`<div class="find warn"><b>Differs from the written process:</b> ${esc(a.note)}</div>`:""}`;
  }
});

const tallyMarks = n => { n=Math.max(0,Math.round(n)); if(n>40) return ""; return "<span class='tally'>"+"<span class='t5'>||||</span>".repeat(Math.floor(n/5))+"|".repeat(n%5)+"</span>"; };

tool({id:"histogram", cat:"qc", icon:"▙", name:"Histogram",
  short:"See the shape, centre and spread of a measurement against its specification.",
  guide:{what:"A bar chart of how often each range of values occurs. It shows whether a process is centred, how wide it spreads, and whether it fits inside the spec limits.",
    when:["To check if a process can meet its specification (capability).","To compare before and after a change.","To spot two populations mixed together (two humps) or a cut-off tail (screened data)."],
    steps:["Collect at least 30, ideally 50–100, measurements.","Enter the spec limits if there are any.","Look at the shape: one hump, two humps, skewed, cut off?","Check the centre against the target and the spread against the limits.","Read Cp/Cpk: 1.33 or more is usually considered capable."],
    tips:["Two humps often mean two machines, shifts or lots: stratify the data.","Cpk assumes a stable, roughly normal process; check the control chart first."]},
  related:["controlchart","stratification"],
  sampleNote:"5 V rail voltage at final test (the #2 Pareto failure). Spec 4.90–5.10 V.",
  resultLabel:"Distribution vs spec",
  next:["controlchart","stratification"],
  steps:[
    {id:"name", q:"What did you measure?", type:"text", ph:"e.g. 5 V rail voltage at final test"},
    {id:"unit", q:"What unit?", type:"text", optional:1, ph:"e.g. V"},
    {id:"data", q:"Paste or type the measurements.", type:"numbers", help:"Separate with spaces, commas or new lines. You can paste a column from Excel."},
    {id:"lsl", q:"Lower spec limit (LSL)?", type:"number", optional:1},
    {id:"usl", q:"Upper spec limit (USL)?", type:"number", optional:1},
    {id:"bins", q:"How many bars? Leave blank for automatic.", type:"number", optional:1}
  ],
  sample:()=>({name:"5 V rail voltage at final test", unit:"V", data:normals(11,80,4.955,0.022,3), lsl:4.90, usl:5.10}),
  render(a){
    const d=parseNums(a.data); if(d.length<2) return EMPTY("Enter at least a few measurements to draw the histogram.");
    const m=mean(d), s=sd(d), lo=Math.min(...d), hi=Math.max(...d), L=num(a.lsl), U=num(a.usl);
    let k=Math.round(num(a.bins)); if(!(k>=3&&k<=60)) k=Math.max(5,Math.min(25,Math.ceil(Math.sqrt(d.length))));
    const xlo=Math.min(lo, Number.isFinite(L)?L:lo), xhi=Math.max(hi, Number.isFinite(U)?U:hi), w=(hi-lo)/k||1;
    const cnt=Array(k).fill(0); d.forEach(v=>{ let i=Math.floor((v-lo)/w); if(i>=k) i=k-1; if(i<0) i=0; cnt[i]++; });
    const pad=(xhi-xlo)*0.05||w;
    const p=plot({xmin:xlo-pad, xmax:xhi+pad, ymin:0, ymax:Math.max(...cnt), ylabel:"Frequency", xlabel:(a.name||"")+(a.unit?` (${a.unit})`:""), H:320});

    cnt.forEach((c,i)=>{ const x0=p.sx(lo+i*w), x1=p.sx(lo+(i+1)*w), y=p.sy(c); g+=`<rect x="${x0+0.5}" y="${y}" width="${Math.max(1,x1-x0-1)}" height="${p.T+p.ph-y}" fill="#60a5fa" stroke="#2563eb" stroke-width=".6"/>`; });
    if(Number.isFinite(s)&&s>0){ const N=d.length*w; let pts=[]; for(let i=0;i<=80;i++){ const x=(xlo-pad)+(xhi-xlo+2*pad)*i/80, y=N/(s*Math.sqrt(2*Math.PI))*Math.exp(-((x-m)**2)/(2*s*s)); pts.push(`${p.sx(x)},${Math.max(p.T,p.sy(Math.min(y,p.y1)))}`); } g+=`<polyline points="${pts.join(" ")}" fill="none" stroke="#1e3a8a" stroke-width="1.6" opacity=".7"/>`; }
    const vline=(v,c,l)=>`<line x1="${p.sx(v)}" x2="${p.sx(v)}" y1="${p.T}" y2="${p.T+p.ph}" stroke="${c}" stroke-width="2" stroke-dasharray="${l==="Mean"?"0":"6 4"}"/>`+T(p.sx(v),p.T+10,l,`text-anchor="middle" font-size="11" font-weight="700" fill="${c}"`);
    if(Number.isFinite(L)) g+=vline(L,"#dc2626","LSL"); if(Number.isFinite(U)) g+=vline(U,"#dc2626","USL"); g+=vline(m,"#0f766e","Mean");
    const out=d.filter(v=>(Number.isFinite(L)&&v<L)||(Number.isFinite(U)&&v>U)).length;
    const cp=Number.isFinite(L)&&Number.isFinite(U)?(U-L)/(6*s):NaN;
    const cpk=Math.min(Number.isFinite(U)?(U-m)/(3*s):Infinity, Number.isFinite(L)?(m-L)/(3*s):Infinity);
    const sk=d.length>2&&s>0?sum(d.map(v=>((v-m)/s)**3))/d.length:0;
    const f=[];

      if(Number.isFinite(cp)&&cp-cpk>0.25) f.push(`Cp (${cp.toFixed(2)}) is well above Cpk: the spread fits, but the process is <b>off-centre</b> toward the ${(U-m)<(m-L)?"upper":"lower"} limit. Re-centring is the first fix.`); }
    if(Math.abs(sk)>0.8) f.push(`The distribution is ${sk>0?"right":"left"}-skewed. Check for a physical limit, screening, or mixed populations.`);
    if(out) f.push(`${out} of ${d.length} values (${pct(out/d.length)}) are outside the spec.`);
    const cls=Number.isFinite(cpk)?(cpk>=1.33?"good":cpk<1?"warn":""):"";
    return p.open+g+"</svg>"+`<div class="kpis">${kpi(d.length,"n")}${kpi(fmtN(m),"Mean")}${kpi(fmtN(s),"Std dev")}${kpi(fmtN(lo)+" – "+fmtN(hi),"Range")}${kpi(Number.isFinite(cp)?cp.toFixed(2):"–","Cp")}${kpi(Number.isFinite(cpk)?cpk.toFixed(2):"–","Cpk")}</div>${f.length?`<div class="find ${cls}"><ul>${f.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}`;
  }

    pts.forEach(q=>{ const c=grp?PAL[ids.indexOf(String(q.id||"").trim())%PAL.length]:"#2563eb"; g+=`<circle cx="${p.sx(q.x)}" cy="${p.sy(q.y)}" r="5" fill="${c}" fill-opacity=".8" stroke="#fff"/>`; });

    const ar=Math.abs(r), str=ar>=0.8?"strong":ar>=0.5?"moderate":ar>=0.3?"weak":"no clear";
    return p.open+g+"</svg>"+`<div class="kpis">${kpi(pts.length,"Pairs")}${kpi(r.toFixed(2),"Correlation r")}${kpi((r*r).toFixed(2),"R² (explained)")}${kpi(fmtN(b),"Slope (Y per X)")}</div>
      <div class="find ${ar>=0.5?"good":""}"><b>${str[0].toUpperCase()+str.slice(1)} ${ar>=0.3?(r>0?"positive":"negative")+" ":""}relationship.</b> ${ar>=0.3?`As ${esc(a.xn||"X")} increases, ${esc(a.yn||"Y")} tends to ${r>0?"increase":"decrease"}. About ${pct(r*r,0)} of the variation in Y lines up with X.`:"X does not explain Y on its own; look for another cause."} Confirm with a controlled test before treating X as the cause.</div>`;
  }
});

/* ---------- Control chart (I-MR) ---------- */
tool({id:"controlchart", cat:"qc", icon:"〰", name:"Control chart",
  short:"Tell normal variation from a real change in the process, over time.",
  guide:{what:"A time-ordered plot with a centre line and control limits calculated from the process itself (here an Individuals and Moving Range chart). Points outside the limits or unusual patterns signal a special cause.",
    when:["To see whether a process is stable before judging capability.","To find when something changed (new lot, operator, setting).","After a fix, to prove the improvement holds (Control / Check phase)."],
    steps:["Collect measurements in time order (at least 20).","Choose which points set the limits (a stable baseline).","Plot with centre line and limits (mean ± 2.66 × average moving range).","Look for signals: a point outside limits, 8 in a row on one side, 6 rising or falling.","Investigate what happened at each signal."],
    tips:["Control limits are the voice of the process, not spec limits.","Don't re-calculate limits to include a known shift; set them from the baseline."]},
  related:["histogram","stratification"],
  sampleNote:"Daily PCBA idle current. Limits from the first 20 days; something changes after that.",
  resultLabel:"I-MR chart",
  next:["stratification","fishbone"],
  steps:[
    {id:"name", q:"What characteristic are you charting?", type:"text", ph:"e.g. PCBA idle current"},
    {id:"unit", q:"What unit?", type:"text", optional:1, ph:"e.g. mA"},
    {id:"data", q:"Paste or type the values in time order.", type:"numbers", help:"Oldest first. One value per sample, separated by spaces, commas or new lines."},
    {id:"base", q:"Use the first how many points to calculate the limits? Leave blank to use all.", type:"number", optional:1, help:"Use a stable period as the baseline, so later changes stand out."}
  ],
  sample:()=>({name:"PCBA idle current", unit:"mA", data:normals(7,20,120,1.4,1).concat(normals(9,10,123.6,1.3,1)), base:20}),
  render(a){
    const d=parseNums(a.data); if(d.length<3) return EMPTY("Enter at least a few values in time order.");
    let n=Math.round(num(a.base)); if(!(n>=2&&n<=d.length)) n=d.length;
    const b=d.slice(0,n), mr=b.slice(1).map((v,i)=>Math.abs(v-b[i])), mrb=mean(mr), cl=mean(b), ucl=cl+2.66*mrb, lcl=cl-2.66*mrb, mucl=3.267*mrb;
    const sig=new Set(), notes=[];
    d.forEach((v,i)=>{ if(v>ucl||v<lcl){ sig.add(i); } });
    if(sig.size) notes.push(`Point${sig.size>1?"s":""} ${[...sig].map(i=>i+1).join(", ")} ${sig.size>1?"are":"is"} outside the control limits.`);
    for(let i=7;i<d.length;i++){ const w=d.slice(i-7,i+1); if(w.every(v=>v>cl)||w.every(v=>v<cl)){ for(let j=i-7;j<=i;j++) sig.add(j); notes.push(`8 points in a row on one side of the centre line ending at point ${i+1}: a <b>shift</b> in the process.`); i+=7; } }
    for(let i=6;i<d.length;i++){ const w=d.slice(i-6,i+1); let up=true,dn=true; for(let j=1;j<w.length;j++){ if(!(w[j]>w[j-1])) up=false; if(!(w[j]<w[j-1])) dn=false; } if(up||dn){ for(let j=i-6;j<=i;j++) sig.add(j); notes.push(`7 points steadily ${up?"rising":"falling"} ending at point ${i+1}: a <b>trend</b>.`); i+=6; } }
    const lo=Math.min(...d,lcl), hi=Math.max(...d,ucl);
    const p=plot({xdom:[0.5,d.length+0.5],xmin:1,xmax:d.length,xticks:niceTicks(1,d.length,8).filter(v=>v>=1&&v<=d.length),ymin:lo,ymax:hi,ylabel:(a.name||"Value")+(a.unit?` (${a.unit})`:""),H:300,B:34});
    let g=p.g; const X=i=>p.sx(i+1);
    const hl=(v,c,l,dash)=>`<line x1="${p.L}" x2="${p.L+p.pw}" y1="${p.sy(v)}" y2="${p.sy(v)}" stroke="${c}" stroke-width="1.5" ${dash?'stroke-dasharray="6 4"':""}/>`+T(p.L+p.pw-2,p.sy(v)-4,`${l} ${fmtN(v)}`,`text-anchor="end" font-size="10.5" font-weight="700" fill="${c}"`);
    g+=hl(ucl,"#dc2626","UCL",1)+hl(cl,"#0f766e","CL",0)+hl(lcl,"#dc2626","LCL",1);
    if(n<d.length) g+=`<line x1="${(X(n-1)+X(n))/2}" x2="${(X(n-1)+X(n))/2}" y1="${p.T}" y2="${p.T+p.ph}" stroke="#94a3b8" stroke-dasharray="3 3"/>`+T((X(n-1)+X(n))/2+4,p.T+10,"after baseline",'font-size="10.5" fill="#64748b"');
    g+=`<polyline points="${d.map((v,i)=>`${X(i)},${p.sy(v)}`).join(" ")}" fill="none" stroke="#2563eb" stroke-width="1.6"/>`;
    d.forEach((v,i)=>{ g+=`<circle cx="${X(i)}" cy="${p.sy(v)}" r="${sig.has(i)?4.5:3.2}" fill="${sig.has(i)?"#dc2626":"#2563eb"}"/>`; });
    const mra=d.slice(1).map((v,i)=>Math.abs(v-d[i]));
    const q=plot({xdom:[0.5,d.length+0.5],xmin:1,xmax:d.length,xticks:niceTicks(1,d.length,8).filter(v=>v>=1&&v<=d.length),ymin:0,ymax:Math.max(...mra,mucl),ylabel:"Moving range",H:170,B:36,xlabel:"Sample number"});
    let h=q.g+`<line x1="${q.L}" x2="${q.L+q.pw}" y1="${q.sy(mucl)}" y2="${q.sy(mucl)}" stroke="#dc2626" stroke-dasharray="6 4"/><line x1="${q.L}" x2="${q.L+q.pw}" y1="${q.sy(mrb)}" y2="${q.sy(mrb)}" stroke="#0f766e"/>`;
    h+=`<polyline points="${mra.map((v,i)=>`${q.sx(i+2)},${q.sy(v)}`).join(" ")}" fill="none" stroke="#64748b" stroke-width="1.3"/>`+mra.map((v,i)=>`<circle cx="${q.sx(i+2)}" cy="${q.sy(v)}" r="2.6" fill="${v>mucl?"#dc2626":"#64748b"}"/>`).join("");
    return p.open+g+"</svg>"+q.open+h+"</svg>"+`<div class="kpis">${kpi(fmtN(cl),"Centre line")}${kpi(fmtN(ucl),"UCL")}${kpi(fmtN(lcl),"LCL")}${kpi(fmtN(mrb),"Avg moving range")}${kpi(n+" pts","Limits based on")}</div>
      <div class="find ${notes.length?"warn":"good"}">${notes.length?`<b>Special-cause signals found:</b><ul>${notes.map(x=>`<li>${x}</li>`).join("")}</ul>Find out what changed at that time.`:"<b>No special-cause signals.</b> The process is stable; only common-cause variation is present."}</div>`;
  }
});

/* ---------- Stratification ---------- */
tool({id:"stratification", cat:"qc", icon:"≡", name:"Stratification",
  short:"Split the data by source to see if the problem is concentrated in one group.",
  guide:{what:"Separating data into groups (strata) by shift, operator, machine, lot, supplier or location. A problem that looks random overall often sits in one group.",
    when:["Before solving the top Pareto bar.","When a histogram has two humps or a scatter plot has clusters.","When you suspect one shift, line, lot or supplier."],
    steps:["Decide which factors to split by.","Record each result with its factor values (and the volume built, if you can).","Compare counts, and better, rates, across groups.","Look for a group far above the others.","Take that group into the root-cause analysis."],
    tips:["Compare rates, not raw counts: a busy shift will have more defects simply because it builds more.","Plan the strata before collecting data, or the tags will be missing."]},
  related:["pareto","checksheet","window"],
  sampleNote:"J3 failures for week 44 split by shift and operator, with boards built by each.",
  resultLabel:"Comparison by group",
  next:["fishbone","window"],
  steps:[
    {id:"what", q:"What result are you splitting?", type:"text", ph:"e.g. J3 cracked-joint failures, week 44"},
    {id:"f1", q:"First factor to split by?", type:"text", ph:"e.g. Shift"},
    {id:"f2", q:"Second factor, nested inside the first?", type:"text", optional:1, ph:"e.g. Operator"},
    {id:"data", q:"Enter one row per group: the factor values, the defect count, and how many were built.", type:"table", minRows:4,
      help:"'Built' is optional but gives a fair comparison as a defect rate.",
      cols:a=>[{k:"g1",l:a.f1||"Factor 1",w:90},...(a.f2?[{k:"g2",l:a.f2,w:90}]:[]),{k:"def",l:"Defects",type:"number",w:70},{k:"built",l:"Built",type:"number",w:70}]}
  ],
  sample:{what:"J3 cracked-joint failures, week 44", f1:"Shift", f2:"Operator", data:[{g1:"Day",g2:"Op A",def:"1",built:"120"},{g1:"Day",g2:"Op B",def:"0",built:"118"},{g1:"Night",g2:"Op C",def:"1",built:"110"},{g1:"Night",g2:"Op D",def:"21",built:"105"}]},
  render(a){
    const d=rows(a.data).map(r=>({g1:String(r.g1||"").trim()||"(blank)",g2:a.f2?String(r.g2||"").trim()||"(blank)":"",def:num(r.def)||0,built:num(r.built)})).filter(r=>r.def>0||Number.isFinite(r.built));
    if(!d.length) return EMPTY();
    const useRate=d.every(r=>Number.isFinite(r.built)&&r.built>0);
    const groups=(key)=>{ const m=new Map(); d.forEach(r=>{ const k=key(r); const o=m.get(k)||{k,def:0,built:0}; o.def+=r.def; o.built+=Number.isFinite(r.built)?r.built:0; m.set(k,o); }); return [...m.values()].map(o=>Object.assign(o,{rate:o.built?o.def/o.built:NaN})); };
    const G1=groups(r=>r.g1), G2=a.f2?groups(r=>r.g1+" / "+r.g2):null, totD=sum(d.map(r=>r.def)), totB=sum(d.map(r=>Number.isFinite(r.built)?r.built:0));
    const chart=(G,title)=>{ const vals=G.map(o=>useRate?o.rate*100:o.def), mx=Math.max(...vals,0.0001), top=vals.indexOf(mx);
      const p=plot({cats:G.map(o=>o.k),ymin:0,ymax:mx,ylabel:useRate?"Defect rate (%)":"Defects",H:250,B:46});
      let g=p.g; G.forEach((o,i)=>{ const y=p.sy(vals[i]), x=p.sx(i)-p.bw*.33; g+=`<rect x="${x}" y="${y}" width="${p.bw*.66}" height="${p.T+p.ph-y}" rx="3" fill="${i===top?"#dc2626":"#94a3b8"}"/>`+T(p.sx(i),y-5,useRate?vals[i].toFixed(1)+"%":fmtN(vals[i]),'text-anchor="middle" font-size="11" font-weight="700" fill="#334155"'); });
      if(useRate&&totB){ const avg=totD/totB*100; g+=`<line x1="${p.L}" x2="${p.L+p.pw}" y1="${p.sy(avg)}" y2="${p.sy(avg)}" stroke="#0f766e" stroke-dasharray="5 4"/>`+T(p.L+p.pw-2,p.sy(avg)-4,"overall "+avg.toFixed(1)+"%",'text-anchor="end" font-size="10.5" fill="#0f766e" font-weight="700"'); }
      return `<div style="font-weight:700;font-size:13px;margin:6px 0 2px">${esc(title)}</div>`+p.open+g+"</svg>"; };
    const best=G=>{ const s=[...G].sort((x,y)=>useRate?(y.rate-x.rate):(y.def-x.def)); return s[0]; };
    const t1=best(G1), t2=G2?best(G2):null, tt=t2||t1;
    let f=`<b>${esc(tt.k)}</b> accounts for ${tt.def} of ${totD} defects (${pct(totD?tt.def/totD:0,0)})`;
    if(useRate&&totB) f+=` while building ${pct(tt.built/totB,0)} of the units. Its rate is <b>${(tt.rate*100).toFixed(1)}%</b> vs ${(totD/totB*100).toFixed(1)}% overall`+(()=>{ const rest=(totD-tt.def)/(totB-tt.built); return Number.isFinite(rest)&&rest>0?` and ${(rest*100).toFixed(1)}% for everyone else (${(tt.rate/rest).toFixed(1)}× higher).`:"."; })();
    else f+=".";
    const tbl=(G2||G1).map(o=>({k:o.k,def:o.def,built:o.built||"–",rate:useRate?pct(o.rate):"–",sh:pct(totD?o.def/totD:0,0),_hi:o===tt}));
    return `<div style="font-weight:700">${esc(a.what||"")}</div>`+chart(G1,"By "+(a.f1||"factor 1"))+(G2?chart(G2,`By ${a.f1||"factor 1"} / ${a.f2}`):"")+
      `<div class="find warn">${f} Take this group into the cause analysis: what is different about it?</div>`+
      miniTable([{k:"k",l:"Group"},{k:"def",l:"Defects",n:1},{k:"built",l:"Built",n:1},{k:"rate",l:"Rate",n:1},{k:"sh",l:"Share of defects",n:1}],tbl);
  }
});

/* ---------- Fishbone ---------- */
const BONES=[["man","Man (people)","Skills, training, fatigue, new or transferred staff, shift handover?"],["machine","Machine","Equipment, fixtures, tools, wear, calibration, maintenance?"],["method","Method","Work instruction, sequence, handling, settings, missing steps?"],["material","Material","Parts, lots, suppliers, PCB, solder, connector variation?"],["measurement","Measurement","Test coverage, gauges, limits, test equipment, inspection method?"],["environment","Environment","Temperature, humidity, ESD, vibration, workspace, time pressure?"]];
tool({id:"fishbone", cat:"qc", icon:"⋘", name:"Fishbone (Ishikawa)",
  short:"Brainstorm every possible cause, sorted into six categories (6M).",
  guide:{what:"A cause-and-effect diagram. The problem is the fish's head; possible causes hang off six bones: Man, Machine, Method, Material, Measurement, Environment.",
    when:["When there are many possible causes and no clear chain yet.","For team brainstorming, so no area is forgotten.","Before 5-Why: pick the most likely bone and drill it down."],
    steps:["Write a specific problem statement in the head.","Brainstorm causes for each of the 6M categories.","Add sub-causes by asking 'why' for each cause.","Circle the most likely causes, based on data where possible.","Verify each circled cause with data (stratification, scatter) or test."],
    tips:["A fishbone lists possible causes; it proves nothing until you verify them.","Keep the head specific: 'J3 joints crack at mating' beats 'quality problems'."]},
  related:["fivewhy","scatter","stratification"],
  sampleNote:"Possible causes of cracked J3 solder joints, after the Pareto and stratification pointed at night shift.",
  resultLabel:"Cause-and-effect diagram",
  next:["fivewhy","fta","window"],
  steps:[
    {id:"effect", q:"What is the problem (the fish's head)? Be specific.", type:"textarea", ph:"e.g. Cracked solder joints at J3 connector found at final test"},
    ...BONES.map(([k,l,h])=>({id:k, q:`Possible causes under ${l}? One per line.`, type:"list", optional:1, help:h})),
    {id:"likely", q:"Which 1–3 causes are most likely? Tick them.", type:"pick", optional:1, help:"They get circled in red on the diagram. Base the choice on data where you can. You can also click any cause on the diagram to circle or un-circle it.",
      opts:a=>BONES.flatMap(([k,l])=>(a[k]||[]).map(c=>[l.replace(/ \(people\)/,""),c]))}
  ],
  sample:{effect:"Cracked solder joints at J3 connector found at final test",
    man:["Operator not trained on fixture","New night-shift operator transferred from another line","Rushing to meet takt"],
    machine:["Back-support fixture worn","Fixture slow to set up","No fixture at night-shift bench 2"],
    method:["WI step 14 says 'use fixture' with no photo","Mating force not specified","Cable mated before chassis install"],
    material:["Connector retention force high","Thin solder fillet (process escape)","Board thickness at low limit"],
    measurement:["Final test misses intermittent opens","No flex check at visual inspection"],
    environment:["Bench mat surface not flat","Night shift has less supervision"],
    likely:["No fixture at night-shift bench 2","New night-shift operator transferred from another line","Final test misses intermittent opens"]},
  render(a){
    if(!String(a.effect||"").trim()) return EMPTY();
    const like=(a.likely||[]).map(x=>x.toLowerCase().trim());
    const W=1000,H=560,sy=280,ax=[340,570,800],hx=820;
    let g=`<line x1="20" y1="${sy}" x2="${hx}" y2="${sy}" stroke="#14213d" stroke-width="3"/><path d="M${hx} ${sy} l-12 -7 v14z" fill="#14213d"/>`;
    g+=`<rect x="${hx+6}" y="${sy-62}" width="${W-hx-12}" height="124" rx="10" fill="#14213d"/>`+TL(hx+16,sy-(Math.min(5,wrap(a.effect,20).length)-1)*9+4,clip(wrap(a.effect,20),5),18,'font-size="14" font-weight="700" fill="#fff"');
    BONES.forEach(([k,l],i)=>{ const top=i<3, at=ax[i%3], tx=at-150, ty=top?50:H-50;
      g+=`<line x1="${at}" y1="${sy}" x2="${tx}" y2="${ty}" stroke="#475569" stroke-width="2"/>`;
      g+=`<rect x="${tx-70}" y="${top?ty-38:ty+10}" width="140" height="26" rx="13" fill="#e6f5f3" stroke="#0f766e"/>`+T(tx,top?ty-20:ty+28,l.replace(/ \(people\)/,""),'text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e"');
      const cs=(a[k]||[]), shown=cs.slice(0,6), n=shown.length;
      shown.forEach((c,j)=>{ const t=(j+1)/(n+1), px=tx+t*(at-tx), py=ty+t*(sy-ty), L=like.includes(c.toLowerCase().trim());
        g+=`<line x1="${px-46}" y1="${py}" x2="${px}" y2="${py}" stroke="#94a3b8" stroke-width="1.2"/>`;
        const tl=clip(wrap(c,23),2), wmax=Math.max(...tl.map(x=>x.length))*7, y0=py-3-(tl.length-1)*14;
        g+=`<g data-likely="${esc(c)}" style="cursor:pointer"><title>${L?"Click to un-circle":"Click to circle as most likely"}</title><rect x="${px-54-wmax}" y="${y0-14}" width="${wmax+12}" height="${tl.length*14+8}" fill="transparent"/>`;
        if(L) g+=`<rect x="${px-54-wmax}" y="${y0-14}" width="${wmax+12}" height="${tl.length*14+8}" rx="8" fill="#fff1f1" stroke="#dc2626" stroke-width="1.8"/>`;
        g+=TL(px-50,y0,tl,14,`text-anchor="end" font-size="12.5" ${L?'font-weight="700" fill="#dc2626"':'fill="#1e293b"'}`)+`</g>`; });
      if(cs.length>6) g+=T(at-20,top?sy-12:sy+20,`+${cs.length-6} more`,'text-anchor="end" font-size="10.5" fill="#64748b"');
    });
    const total=sum(BONES.map(([k])=>(a[k]||[]).length)), empty=BONES.filter(([k])=>!(a[k]||[]).length).map(b=>b[1]);
    return `<div class="svscroll" style="--minw:720px"><svg viewBox="0 0 ${W} ${H}" class="chart" xmlns="http://www.w3.org/2000/svg">${g}</svg></div>
      <div class="kpis">${kpi(total,"Possible causes")}${kpi((a.likely||[]).length,"Most likely")}${kpi(6-empty.length+" / 6","Categories used")}</div>
      ${(a.likely||[]).length?`<div class="find warn"><b>Most likely causes (circled):</b><ul>${a.likely.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>Verify each with data, then drill the confirmed one down with 5-Why.${a.likely.length>3?" <b>That's more than 3:</b> narrow it to the causes with the strongest evidence.":""}</div>`:""}
      ${empty.length?`<div class="find">No causes yet under: ${empty.map(esc).join(", ")}. Worth a second look.</div>`:""}`;
  }
});

/* ===================== ROOT-CAUSE METHODS ===================== */
const short = (s,n=70) => { s=String(s||"").trim().replace(/^because\s*/i,""); return s.length>n ? s.slice(0,n-1)+"…" : s; };

/* ---------- 5-Why ---------- */
const WHYS=["w1","w2","w3","w4","w5"];
tool({id:"fivewhy", cat:"rc", icon:"5?", name:"5-Why analysis",
  short:"Ask 'why?' repeatedly to drill from the symptom to a cause you can act on.",
  guide:{what:"A chain of questions. Each answer becomes the next 'why?', until you reach a cause in the system (a design rule, process, standard or test) that you can fix so the problem can't come back.",
    when:["When there is one clear causal chain, ideally from a verified failure mechanism.","For problems involving people or process, together with Window analysis.","Inside 8D D4, EAS Analyze or DMAIC Analyze."],
    steps:["Write a specific problem statement with the facts (what, where, how many).","Ask 'Why did this happen?' and answer with a fact you can check.","Repeat for each answer, usually about five times.","Stop at a cause the organisation controls and can change.","Check it backwards: read the chain upward with 'therefore'.","Run a second chain for 'why wasn't it detected?' if the defect escaped."],
    tips:["'Operator error' is never a root cause: ask why the system allowed the error.","Five is a guide, not a rule. Stop when the next 'why' leaves your control.","If an answer is a guess, verify it before continuing."]},
  related:["fishbone","window","fta"],
  sampleNote:"Drilling from the stratified J3 failures (night shift, operator D) to the systemic cause.",
  resultLabel:"Why-chain",
  next:["window","forcefield"],
  steps:[
    {id:"problem", q:"What is the problem? State the facts: what, where, when, how many.", type:"textarea", ph:"e.g. J3 solder joints crack on boards built on night shift (21 of 105, week 44)"},
    {id:"start", q:"What has been verified so far (the failure mechanism or key evidence)?", type:"textarea", optional:1, ph:"e.g. FA confirmed fatigue crack from board flex during mating"},
    ...WHYS.map((w,i)=>({id:w, optional:i>=3,
      q:a=>`Why? “${short(i?a[WHYS[i-1]]:a.problem,90)||"…"}”`,
      help:i>=3?"Leave blank and Skip if you have already reached a cause you can act on.":"Start with 'Because…'. Give a fact you can check, not a guess.",
      type:"textarea", ph:"Because…", when:a=>i<3||!!String(a[WHYS[i-1]]||"").trim()})),
    {id:"root", q:"What is the root cause you can act on?", type:"textarea", def:a=>{ const l=[...WHYS].reverse().find(w=>String(a[w]||"").trim()); return l?short(a[l],400):""; },
      help:"Usually the last 'why'. It should be in the system: a standard, process, design rule or check."},
    {id:"check", q:a=>"Read it backwards with “therefore”. Does every step follow from the one below it?", type:"choice", opts:[["yes","Yes, the logic holds"],["no","No, a link is weak or unproven"]]},
    {id:"cm", q:"What countermeasures address the root cause?", type:"table", minRows:3,
      cols:[{k:"act",l:"Action",w:220},{k:"type",l:"Type",type:"select",opts:[["",""],["Fix","Fix (correct)"],["Prevent","Prevent recurrence"],["Detect","Improve detection"]]},{k:"owner",l:"Owner",w:90},{k:"due",l:"Due",w:70}]},
    {id:"escape", q:"Why wasn't the problem detected before it escaped?", type:"textarea", optional:1, help:"A second, short why-chain for detection."}
  ],
  sample:{problem:"J3 solder joints crack on PCBAs built on night shift: 21 of 105 boards by operator D in week 44 (0–1% for other operators).",
    start:"FA confirmed fatigue cracks at J3 pins 3–6 caused by board flex during cable mating (strain gauge: about 1,100 µε without support vs 250 µε with the fixture).",

const WS=[["KP","Established · practiced 100%"],["KN","Established · not practiced 100%"],["U","Not established"]];

  B:{n:"Practice problem",k:"kB",d:"The method is established but not practiced 100%.",cm:"Find out whether it is B1 (can't do it: skill) or B2 (doesn't always do it: compliance). Each needs a different fix."},

  B2:{n:"Practice problem · compliance (B2)",k:"kB",d:"People know the method and can do it, but don't always do it (forget, inconvenient, time pressure).",cm:"Make it hard to skip: mistake-proofing (poka-yoke, interlock, monitor with alarm), make the right way the easy way, visual reminders, checklists, supervision and audits."},

const wcell=(x,y)=> x==="U"&&y==="U"?"D" : (x==="U"||y==="U")?"C" : (x==="KP"&&y==="KP")?"A" : "B";
function waCat(a){ const q=k=>a[k]&&a[k].a;
  if(!q("q1")) return null; if(q("q1")==="no") return "D";
  if(!q("q2")) return null; if(q("q2")==="no") return "C";

const wReach=(a,i)=>["q1","q2","q3","q4"].slice(0,i).every(k=>a[k]&&a[k].a==="yes");

const WQ=[["q1","Is there a right","method (standard)?","D"],["q2","Does everyone","know that method?","C"],["q3","Do they know how","to do it correctly?","B1"],["q4","Does everyone","always do it?","B2"]];
function wTree(a){

function wGrid(a, cat, items){

const FK=[["basic","Basic event"],["or","OR gate (any one)"],["and","AND gate (all together)"]];
function ftaBuild(a){
  const ev=rows(a.events).map(r=>({id:String(r.id||"").trim(),d:String(r.d||"").trim(),par:String(r.par||"").trim()||"T",k:r.k||"basic",p:num(r.p)})).filter(r=>r.id&&r.id!=="T");
  const nodes={T:{id:"T",d:a.top||"Top event",k:a.gate||"or",ch:[]}}; const warn=[];
  ev.forEach(e=>{ if(nodes[e.id]) warn.push(`Duplicate ID ${e.id}`); nodes[e.id]=Object.assign({ch:[]},e); });
  ev.forEach(e=>{ const p=nodes[e.par]; if(!p){ warn.push(`${e.id}: parent “${e.par}” not found`); return; } if(p.k==="basic"){ warn.push(`${e.id}: parent ${e.par} is a basic event; make it a gate`); return; } p.ch.push(e.id); });
  const prob=(id,seen=new Set())=>{ const n=nodes[id]; if(seen.has(id)) return NaN; seen.add(id);
    if(n.k==="basic"||!n.ch.length) return n.k==="basic"?n.p:NaN;
    const ps=n.ch.map(c=>prob(c,new Set(seen))); if(ps.some(x=>!Number.isFinite(x))) return NaN;
    return n.k==="and" ? ps.reduce((x,y)=>x*y,1) : 1-ps.reduce((x,y)=>x*(1-y),1); };
  const cuts=(id,depth=0)=>{ const n=nodes[id]; if(depth>30) return [];
    if(n.k==="basic") return [[id]]; if(!n.ch.length) return [];
    const cs=n.ch.map(c=>cuts(c,depth+1));
    if(n.k==="or") return cs.flat();
    let acc=[[]]; cs.forEach(set=>{ const nx=[]; acc.forEach(x=>set.forEach(y=>nx.push([...new Set([...x,...y])].sort()))); acc=nx.slice(0,500); }); return acc; };
  let cs=cuts("T").sort((x,y)=>x.length-y.length); const min=[];
  cs.forEach(c=>{ if(!min.some(m=>m.every(x=>c.includes(x)))) min.push(c); });
  return {nodes,warn,P:prob("T"),min,prob};
}

    {id:"events", q:"List every event below the top. Give each an ID, its parent (T = top event), and whether it's a gate or a basic event.", type:"table", minRows:4,
      help:"Probabilities are only needed for basic events (e.g. 0.02 = 2%). Leave blank if unknown.",
      cols:[{k:"id",l:"ID",w:50,ph:"G1"},{k:"d",l:"Description",w:210},{k:"par",l:"Parent",w:55,ph:"T"},{k:"k",l:"Type",type:"select",opts:FK},{k:"p",l:"Probability",type:"number",w:70}]}
  ],
  sample:{top:"J3 intermittent open in the field", gate:"or", events:[
    {id:"G1",d:"Cracked solder joint at J3",par:"T",k:"and"},
    {id:"G2",d:"Excessive flex stress on the joint",par:"G1",k:"or"},
    {id:"B1",d:"Board flexed at mating, no support fixture",par:"G2",k:"basic",p:"0.08"},
    {id:"B2",d:"Thermal-cycling fatigue downhole",par:"G2",k:"basic",p:"0.02"},
    {id:"B3",d:"Thin solder fillet (process escape)",par:"G1",k:"basic",p:"0.03"},
    {id:"B4",d:"Connector pin bent or damaged",par:"T",k:"basic",p:"0.002"},
    {id:"B5",d:"Harness-side connector defect",par:"T",k:"basic",p:"0.001"}]},
  render(a){
    if(!String(a.top||"").trim()) return EMPTY();
    const {nodes,warn,P,min,prob}=ftaBuild(a);
    const BW=156, BH=60, LX=176, LY=124;
    const lay={}; let leaf=0;
    const place=(id,depth,seen)=>{ if(seen.has(id)) return; seen.add(id); const n=nodes[id];
      if(!n.ch.length){ lay[id]={x:leaf*LX, d:depth}; leaf++; return; }
      n.ch.forEach(c=>place(c,depth+1,seen)); const xs=n.ch.filter(c=>lay[c]).map(c=>lay[c].x); lay[id]={x:(Math.min(...xs)+Math.max(...xs))/2, d:depth}; };
    place("T",0,new Set());
    const maxD=Math.max(...Object.values(lay).map(l=>l.d)), W=Math.max(1,leaf)*LX+20, H=(maxD+1)*LY+20;
    const X=id=>lay[id].x+10+(LX-BW)/2, Y=id=>lay[id].d*LY+10;
    const crit=new Set(min.filter(c=>c.length===1).flat());
    let g="";
    Object.keys(lay).forEach(id=>{ const n=nodes[id]; if(!n.ch.length||n.k==="basic") return; const cx=X(id)+BW/2, gy=Y(id)+BH+30;
      n.ch.filter(c=>lay[c]).forEach(c=>{ const tx=X(c)+BW/2, ty=Y(c); g+=`<path d="M${cx} ${gy} V${gy+12} H${tx} V${ty}" fill="none" stroke="#64748b" stroke-width="1.4"/>`; }); });
    Object.keys(lay).forEach(id=>{ const n=nodes[id], x=X(id), y=Y(id), isB=n.k==="basic", cr=crit.has(id);
      const pr=prob(id);
      g+=`<rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="6" fill="${id==="T"?"#14213d":isB?(cr?"#fff1f1":"#fff"):"#fdf3e5"}" stroke="${id==="T"?"#14213d":isB?(cr?"#dc2626":"#64748b"):"#b45309"}" stroke-width="1.5"/>`;
      g+=T(x+7,y+14,id,`font-size="10.5" font-weight="800" fill="${id==="T"?"#93c5fd":"#64748b"}" font-family="monospace"`);
      if(Number.isFinite(pr)) g+=T(x+BW-7,y+14,"p="+(pr<0.001?pr.toExponential(1):(+pr.toPrecision(2))),`text-anchor="end" font-size="10.5" font-weight="700" fill="${id==="T"?"#fcd34d":"#b45309"}"`);
      g+=TL(x+BW/2,y+30,clip(wrap(n.d,24),2),13,`text-anchor="middle" font-size="11.5" font-weight="600" fill="${id==="T"?"#fff":"#14213d"}"`);
      const cx=x+BW/2, gy=y+BH;
      if(!isB && n.ch.length){
        if(n.k==="and") g+=`<path d="M${cx-14} ${gy+30} V${gy+14} A14 14 0 0 1 ${cx+14} ${gy+14} V${gy+30} Z" fill="#fff" stroke="#b45309" stroke-width="1.6"/>`+T(cx,gy+26,"AND",'text-anchor="middle" font-size="8" font-weight="800" fill="#b45309"');
        else g+=`<path d="M${cx-15} ${gy+30} Q${cx} ${gy+22} ${cx+15} ${gy+30} Q${cx+13} ${gy+12} ${cx} ${gy+2} Q${cx-13} ${gy+12} ${cx-15} ${gy+30} Z" fill="#fff" stroke="#b45309" stroke-width="1.6"/>`+T(cx,gy+24,"OR",'text-anchor="middle" font-size="8" font-weight="800" fill="#b45309"');
        g+=`<line x1="${cx}" y1="${gy}" x2="${cx}" y2="${gy+2}" stroke="#b45309"/>`;
      }
      if(isB) g+=`<circle cx="${cx}" cy="${gy+12}" r="9" fill="#fff" stroke="${cr?"#dc2626":"#64748b"}" stroke-width="1.5"/><line x1="${cx}" y1="${gy}" x2="${cx}" y2="${gy+3}" stroke="#64748b"/>`;
    });
    const svg=`<div class="svscroll" style="--minw:${W>900?Math.round(W*0.6):0}px"><svg viewBox="0 0 ${W} ${H}" class="chart" xmlns="http://www.w3.org/2000/svg">${g}</svg></div>`;
    const csRows=min.map(c=>{ const p=c.map(id=>nodes[id].p); const pp=p.every(Number.isFinite)?p.reduce((x,y)=>x*y,1):NaN; return {cs:c.map(id=>`${id} · ${nodes[id].d}`).join("  +  "),o:c.length,p:pp}; }).sort((x,y)=>(Number.isFinite(y.p)?y.p:-1)-(Number.isFinite(x.p)?x.p:-1)||x.o-y.o);
    const tot=sum(csRows.filter(r=>Number.isFinite(r.p)).map(r=>r.p));
    const tbl=miniTable([{k:"cs",l:"Minimal cut set (events that together cause the top event)"},{k:"o",l:"Order",n:1},{k:"pp",l:"Probability",n:1},{k:"sh",l:"Share",n:1}], csRows.map(r=>({cs:r.cs,o:r.o,pp:Number.isFinite(r.p)?(+r.p.toPrecision(2)):"–",sh:Number.isFinite(r.p)&&tot?pct(r.p/tot,0):"–",_hi:r.o===1})));
    const sp=min.filter(c=>c.length===1);
    return svg+`<div class="kpis">${kpi(Number.isFinite(P)?(P<0.001?P.toExponential(2):pct(P,2)):"–","Top-event probability")}${kpi(min.length,"Minimal cut sets")}${kpi(sp.length,"Single points of failure")}</div>`+
      (warn.length?`<div class="find warn"><b>Check the tree:</b><ul>${warn.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:"")+
      (csRows.length?`<div class="find">${csRows[0]&&Number.isFinite(csRows[0].p)?`The largest contributor is <b>${esc(csRows[0].cs)}</b> (${pct(tot?csRows[0].p/tot:0,0)} of the total). `:""}${sp.length?`<b>${sp.length} single point(s) of failure</b> (highlighted red) need only one event to cause the top event.`:"No single point of failure: every path needs two or more events."}</div>`+tbl:"");
  }
});

tool({id:"forcefield", cat:"sol", icon:"⇄", name:"Force-field analysis",
  short:"Weigh the forces driving a change against those resisting it, and plan how to tip the balance.",
  guide:{what:"Kurt Lewin's method for planning change. List the forces pushing toward the change (driving) and against it (restraining), rate their strength, then plan actions to strengthen drivers and, usually more effectively, weaken restraints.",
    when:["Before implementing a countermeasure that people must adopt.","When a past fix didn't stick.","To decide between proceeding, adjusting, or stopping a change."],
    steps:["State the change and the desired end state.","List the driving forces and rate each 1–5.","List the restraining forces and rate each 1–5.","Compare the totals and look at the strongest restraints.","Plan actions, focusing first on reducing the strongest restraints."],
    tips:["Pushing harder on drivers often increases resistance; removing restraints is usually more effective.","Ask the people doing the work for the restraining forces; they know them best."]},
  related:["fivewhy","window"],
  sampleNote:"Making the J3 back-support fixture mandatory, with an interlock, at every cable bench.",
  resultLabel:"Force-field diagram",
  next:["controlchart"],
  steps:[
    {id:"change", q:"What change are you proposing?", type:"textarea", ph:"e.g. Make the J3 back-support fixture mandatory with an interlock at every cable bench"},
    {id:"goal", q:"What is the desired end state?", type:"text", optional:1, ph:"e.g. Zero J3 cracks from mating"},
    {id:"drv", q:"What forces drive the change forward? Rate each 1 (weak) to 5 (strong).", type:"table", minRows:3,
      cols:[{k:"f",l:"Driving force",w:230},{k:"s",l:"Strength",type:"select",opts:STR}]},
    {id:"res", q:"What forces resist or block the change? Rate each 1 to 5.", type:"table", minRows:3,
      cols:[{k:"f",l:"Restraining force",w:230},{k:"s",l:"Strength",type:"select",opts:STR}]},
    {id:"acts", q:"What actions will strengthen drivers or weaken restraints?", type:"table", optional:1, minRows:2,
      cols:[{k:"a",l:"Action",w:220},{k:"t",l:"Targets which force",w:150},{k:"o",l:"Owner",w:80}]},
    {id:"dec", q:"What is the decision?", type:"choice", optional:1, opts:[["go","Proceed"],["go-act","Proceed with the actions above"],["hold","Hold: rework the proposal"],["stop","Do not proceed"]]}
  ],
  sample:{change:"Make the J3 back-support fixture mandatory, with a presence interlock, at every cable bench", goal:"Zero J3 cracked joints from mating; fixture use no longer depends on memory",
    drv:[{f:"Field failures and non-productive time cost on customer jobs",s:"5"},{f:"23 J3 failures per week at final test (rework cost)",s:"4"},{f:"Low-cost fixture design already exists",s:"3"},{f:"Quality / Reliability backing the change",s:"3"}],
    res:[{f:"Fixture adds about 2 minutes per board against takt",s:"4"},{f:"Three more fixtures needed: cost and 6-week lead time",s:"3"},{f:"Operators see it as an extra step",s:"2"},{f:"WI and training updates across all shifts",s:"2"}],
    acts:[{a:"Redesign fixture with quick-clamp (under 20 s)",t:"Adds 2 min per board",o:"Mfg Eng"},{a:"3D-print interim fixtures this week",t:"Cost and lead time",o:"Mfg Eng"},{a:"Show the FA crack photos at a toolbox talk",t:"Seen as extra step",o:"Prod Supv"}],
    dec:"go-act"},
  render(a){
    const D=rows(a.drv).filter(r=>String(r.f||"").trim()).map(r=>({f:r.f,s:num(r.s)||1})), R=rows(a.res).filter(r=>String(r.f||"").trim()).map(r=>({f:r.f,s:num(r.s)||1}));
    if(!String(a.change||"").trim()) return EMPTY();
    const n=Math.max(D.length,R.length,1), RH=54, W=720, cx=360, U=22, top=96, H=top+n*RH+16;
    let g=`<rect x="${cx-190}" y="6" width="380" height="54" rx="8" fill="#14213d"/>`+TL(cx,28,clip(wrap(a.change,48),2),16,'text-anchor="middle" font-size="13" font-weight="700" fill="#fff"');
    g+=`<line x1="${cx}" y1="${top-8}" x2="${cx}" y2="${H-6}" stroke="#14213d" stroke-width="3"/>`;
    g+=T(cx-14,top-14,"DRIVING →",'text-anchor="end" font-size="12" font-weight="800" fill="#15803d"')+T(cx+14,top-14,"← RESTRAINING",'font-size="12" font-weight="800" fill="#dc2626"');
    D.forEach((d,i)=>{ const y=top+i*RH+RH/2, L=d.s*U, x0=cx-8-L; g+=`<path d="M${x0} ${y-7} H${cx-22} V${y-13} L${cx-8} ${y} L${cx-22} ${y+13} V${y+7} H${x0} Z" fill="#22c55e" fill-opacity=".85"/>`+T(x0+6,y+4,d.s,'font-size="11" font-weight="800" fill="#fff"')+TL(x0-8,y-(clip(wrap(d.f,26),3).length-1)*7+4,clip(wrap(d.f,26),3),14,'text-anchor="end" font-size="12.5" fill="#14532d"'); });
    R.forEach((d,i)=>{ const y=top+i*RH+RH/2, L=d.s*U, x1=cx+8+L; g+=`<path d="M${x1} ${y-7} H${cx+22} V${y-13} L${cx+8} ${y} L${cx+22} ${y+13} V${y+7} H${x1} Z" fill="#ef4444" fill-opacity=".85"/>`+T(x1-6,y+4,d.s,'text-anchor="end" font-size="11" font-weight="800" fill="#fff"')+TL(x1+8,y-(clip(wrap(d.f,26),3).length-1)*7+4,clip(wrap(d.f,26),3),14,'font-size="12.5" fill="#7f1d1d"'); });
    const sd_=sum(D.map(d=>d.s)), sr=sum(R.map(d=>d.s)), strongest=[...R].sort((x,y)=>y.s-x.s)[0];
    const acts=rows(a.acts).filter(filled);
    const DEC={go:"Proceed",["go-act"]:"Proceed with the actions",hold:"Hold: rework the proposal",stop:"Do not proceed"};
    return `<div class="svscroll" style="--minw:560px"><svg viewBox="0 0 ${W} ${H}" class="chart" xmlns="http://www.w3.org/2000/svg">${g}</svg></div>
      <div class="kpis">${kpi(sd_,"Driving total")}${kpi(sr,"Restraining total")}${kpi((sd_-sr>0?"+":"")+(sd_-sr),"Balance")}${a.dec?kpi(DEC[a.dec],"Decision"):""}</div>
      <div class="find ${sd_>sr?"good":"warn"}">${sd_>sr?"Driving forces outweigh the restraints, but strong restraints can still stall the change.":"Restraints are as strong as or stronger than the drivers: the change is likely to stall without action."}${strongest?` Tackle <b>${esc(strongest.f)}</b> (${strongest.s}/5) first; weakening a restraint usually works better than pushing harder.`:""}</div>
      ${a.goal?`<div class="find"><b>Desired end state:</b> ${esc(a.goal)}</div>`:""}
      ${acts.length?miniTable([{k:"a",l:"Action"},{k:"t",l:"Targets"},{k:"o",l:"Owner"}],acts):""}`;
  }
});

/* ---------- 4M + I / CMV matrix ---------- */
const M5=[["man","Man"],["machine","Machine"],["material","Materials"],["method","Methods"],["info","Information"]];
const CMV=[["V","Variation","Things that vary from part to part, person to person or day to day."],["M","Mistakes","Something done wrong or left out."],["C","Complexity","Something hard to do, make or understand, so errors are likely."]];
const CMV_EX={
  V:{man:"Training, experience, skill",machine:"Tool wear, bearing wear, fixture wear, vibration",material:"Purity, density, homogeneity",method:"Differences in execution",info:"Gauge consistency or accuracy"},
  M:{man:"Omission errors, dropped parts",machine:"Incorrect setup, software errors",material:"Wrong material, wrong part",method:"Wrong method, error in method",info:"Wrong instructions, instruction error, misread gauge"},
  C:{man:"Individual differences, emotion",machine:"Difficult setup, difficult operation",material:"Difficult to make, difficult to shape",method:"Difficult method",info:"Lengthy or verbose instructions, many interpretations"}};
const CMV_FIX={V:"Reduce and control variation: standard settings, preventive maintenance, material specs, training to a standard, gauge R&R; monitor with control charts.",
  M:"Mistake-proof: poka-yoke, interlocks, checklists, clear labelling and part keying. See Window analysis (B2) for 'not always done'.",
  C:"Simplify: design for assembly, fewer and simpler steps, easier setups, short instructions with pictures and one interpretation."};
const ICON={man:"👤",machine:"⚙",material:"▭",method:"⇄",info:"ⓘ"};
tool({id:"cmv", cat:"rc", icon:"4M", name:"4M + I / CMV matrix",
  short:"Classify each defect source by where it comes from (Man, Machine, Materials, Methods, Information) and what kind it is (Variation, Mistake, Complexity).",
  guide:{what:"A 5 × 3 matrix for classifying defect sources. The columns are the 4 M's plus Information; the rows are the three ways defects arise: <b>Variation</b>, <b>Mistakes</b> and <b>Complexity</b>. Where the causes cluster tells you which kind of countermeasure to use.",
    when:["After a fishbone, to sort the causes and see where they cluster.","When a team keeps proposing the same type of fix (often 'retrain') for different kinds of problem.","To decide between variation reduction, mistake-proofing and simplification."],
    steps:["State the problem.","List causes that are about <b>variation</b> and assign each to an M (or Information).","List causes that are <b>mistakes</b>.","List causes that come from <b>complexity</b>.","Mark which causes are verified, then read the matrix: the busiest row tells you the type of fix."],
    tips:["Variation → reduce and control it (SPC). Mistakes → mistake-proof. Complexity → simplify.","'Information' covers instructions, drawings, gauges and test data: a wrong or ambiguous instruction is a cause in its own right.","The cell examples come from the course chart and are shown as prompts in empty cells."]},
  related:["fishbone","window","controlchart"],
  sampleNote:"The J3 cracked-joint causes from the fishbone, classified. "+COURSE,
  resultLabel:"Classification matrix",
  next:["fivewhy","window"],
  steps:[
    {id:"problem", q:"What is the problem?", type:"textarea", ph:"e.g. Cracked solder joints at J3 found at final test"},
    ...CMV.map(([k,n,d])=>({id:"r"+k, type:"table", minRows:2, optional:1,
      q:`Which causes are about ${n.toUpperCase()}? ${d}`,
      help:"Examples: "+M5.map(([m,l])=>`${l}: ${CMV_EX[k][m]}`).join(" · "),
      cols:[{k:"c",l:"Cause",w:210},{k:"m",l:"Source",type:"select",opts:[["",""],...M5]},{k:"s",l:"Status",type:"select",opts:["","Suspected","Verified"]}]}))
  ],
  sample:{problem:"Cracked solder joints at J3 connector found at final test",
    rV:[{c:"Operator D new to the line (experience)",m:"man",s:"Verified"},{c:"Back-support fixture worn",m:"machine",s:"Suspected"},{c:"Board thickness at low limit",m:"material",s:"Suspected"}],
    rM:[{c:"Fixture step omitted on night shift",m:"man",s:"Verified"},{c:"No fixture set up at bench 2",m:"machine",s:"Verified"},{c:"Transfer checklist has no WI training step",m:"method",s:"Verified"},{c:"WI step 14 has no photo; easy to misread",m:"info",s:"Suspected"}],
    rC:[{c:"Fixture slow to set up",m:"method",s:"Verified"},{c:"High connector retention force: hard to mate",m:"material",s:"Suspected"}]},
  render(a){
    const all=[]; CMV.forEach(([k])=>rows(a["r"+k]).forEach(r=>{ if(String(r.c||"").trim()&&r.m) all.push(Object.assign({t:k},r)); }));
    if(!String(a.problem||"").trim() && !all.length) return EMPTY();
    let h=`<div class="find" style="margin:0 0 10px"><b>Problem:</b> ${esc(a.problem||"")}</div><div class="tscroll"><table class="cmvt"><tr><th></th>${M5.map(([m,l])=>`<th><span class="ic">${ICON[m]}</span>${l}</th>`).join("")}<th class="n">Total</th></tr>`;
    CMV.forEach(([k,n])=>{ const rr=all.filter(r=>r.t===k);
      h+=`<tr><th class="rh rh${k}">${n}</th>`+M5.map(([m])=>{ const cs=rr.filter(r=>r.m===m);
        return `<td class="${cs.length?"has":""}">${cs.length?cs.map(r=>`<div class="cc${r.s==="Verified"?" v":""}">${esc(r.c)}</div>`).join(""):`<div class="ex">${esc(CMV_EX[k][m])}</div>`}</td>`; }).join("")+`<td class="n"><b>${rr.length}</b></td></tr>`; });
    h+=`<tr><th>Total</th>${M5.map(([m])=>`<td class="n"><b>${all.filter(r=>r.m===m).length}</b></td>`).join("")}<td class="n"><b>${all.length}</b></td></tr></table></div>
      <div style="font-size:11.5px;color:var(--mute);margin-top:4px">Grey italic text in empty cells is the course chart's example, as a prompt. <b style="color:#b91c1c">Bold red</b> = verified.</div>`;
    if(all.length){
      const ver=all.filter(r=>r.s==="Verified"), base=ver.length?ver:all;
      const byT=CMV.map(([k,n])=>[k,n,base.filter(r=>r.t===k).length]).sort((x,y)=>y[2]-x[2]);
      const byM=M5.map(([m,l])=>[l,all.filter(r=>r.m===m).length]).sort((x,y)=>y[1]-x[1]);
      h+=`<div class="kpis">${kpi(all.length,"Causes classified")}${kpi(ver.length,"Verified")}${kpi(esc(byT[0][1]),"Most common type"+(ver.length?" (verified)":""))}${kpi(esc(byM[0][0]),"Most common source")}</div>`;
      h+=`<div class="find warn"><b>Countermeasure type</b>${ver.length?" (based on verified causes)":""}:<ul>${byT.filter(x=>x[2]).map(([k,n,c])=>`<li><b>${n}</b> (${c}): ${esc(CMV_FIX[k])}</li>`).join("")}</ul></div>`;
    }
    return h;
  }
});

  resultLabel:"Weighted scores and rank",

    opts:["Interlock fixture at all benches","Retrain all operators","Add J3 wiggle test only","Lower-retention connector (redesign)"],

    if(Math.abs(ws-1)>0.005) h+=`<div class="find warn" style="margin-top:0">The weights add up to <b>${ws.toFixed(2)}</b>, not 1.00. Totals are still comparable, but check the weights are what you intended.</div>`;
    if(!op.length) return h+EMPTY("Add the options to score.");
    const rt=iwSync(a,a.rate), bad=[];
    const res=rt.map(r=>{ const rs=cr.map((c,i)=>{ const v=num(r["c"+i]); if(Number.isFinite(v)&&(v<1||v>5)) bad.push(`${r.opt} / ${c.n}`); return v; });
      const wv=rs.map((v,i)=>Number.isFinite(v)&&Number.isFinite(cr[i].w)?v*cr[i].w:NaN);
      return {o:r.opt, rs, wv, tot:sum(wv.filter(Number.isFinite)), n:rs.filter(Number.isFinite).length}; });
    const sorted=[...res].map(r=>r.tot).sort((x,y)=>y-x); res.forEach(r=>r.rank=sorted.indexOf(r.tot)+1);
    h+=`<div class="tscroll"><table class="iwm"><tr><th></th>${cr.map(c=>`<th>${esc(c.n)}</th>`).join("")}<th colspan="2"></th></tr>
      <tr class="wt"><th></th>${cr.map(c=>`<td>${Number.isFinite(c.w)?c.w.toFixed(2):"–"}</td>`).join("")}<td colspan="2">Weight factor</td></tr>`;
    res.forEach(r=>{ const top=r.rank===1&&r.n;
      h+=`<tr class="rt1"><th rowspan="2">${esc(r.o)}</th>${r.rs.map(v=>`<td>${Number.isFinite(v)?fmtN(v):""}</td>`).join("")}<td rowspan="2" class="tot">${r.n?r.tot.toFixed(2):"–"}</td><td rowspan="2" class="rk${top?" top":""}">${r.n?(top?"★ ":"")+r.rank:""}</td></tr>
        <tr class="rt2">${r.wv.map(v=>`<td>${Number.isFinite(v)?v.toFixed(Math.abs(v*10-Math.round(v*10))<1e-9?1:2):""}</td>`).join("")}</tr>`; });
    h+=`</table></div><div style="font-size:11.5px;color:var(--mute);margin-top:4px">Each option: top row = rating (1–5), bottom row = rating × weight. Rank 1 is the best selection.</div>`;
    if(bad.length) h+=`<div class="find warn">Ratings outside 1–5: ${bad.map(esc).join(", ")}.</div>`;
    const done=res.filter(r=>r.n);
    if(done.length){
      const s=[...done].sort((x,y)=>y.tot-x.tot);
      const p=plot({cats:s.map(r=>r.o),ymin:0,ymax:Math.max(...s.map(r=>r.tot),0.1),ylabel:"Weighted score",H:240,B:46});
      let g=p.g; s.forEach((r,i)=>{ const y=p.sy(r.tot); g+=`<rect x="${p.sx(i)-p.bw*.32}" y="${y}" width="${p.bw*.64}" height="${p.T+p.ph-y}" rx="3" fill="${r.rank===1?"#7c3aed":"#c4b5fd"}"/>`+T(p.sx(i),y-5,r.tot.toFixed(2),'text-anchor="middle" font-size="11" font-weight="700" fill="#334155"'); });
      h+=p.open+g+"</svg>";
      const gap=s.length>1?s[0].tot-s[1].tot:NaN;
      h+=`<div class="find good"><b>Rank 1: ${esc(s[0].o)}</b> (${s[0].tot.toFixed(2)})${s.length>1?`, ahead of ${esc(s[1].o)} by ${gap.toFixed(2)}.`:"."}${Number.isFinite(gap)&&gap<0.2?" The margin is small: check how sensitive the result is to the weights before deciding.":""}</div>`;
    }
    if(a.note) h+=`<div class="find"><b>Decision:</b> ${esc(a.note)}</div>`;
    return h;
  }
});

const PT=[["process","Process step"],["decision","Decision (Yes/No)"],["key","Key RCA step (highlighted)"],["ref","Refer to another procedure"],["start","Start"],["end","End / close"]];

function procRender(a){

  let y=56; const P=[];
  st.forEach(r=>{ const ty=r.ty||"process", dec=ty==="decision";
    const bl=clip(wrap(r.t,dec?24:36),3), rl=clip(wrap(r.r||"",20),3), il=clip(wrap(r.i||"",36),7);
    const bh=dec?Math.max(70,bl.length*LH+40):Math.max(44,bl.length*LH+18);
    const nm=String(r.no||"").trim().match(/^(\d+)\s*[-–:.]?\s*(.*)$/);
    const side=String(r.no||"").trim()&&!nm ? clip(wrap(r.no,21),4) : null;
    const lab=nm&&nm[2]?clip(wrap(nm[2],19),3):null;
    const rh=Math.max(bh, rl.length*LH+8, il.length*LH+8, side?side.length*LH+18:0, lab?bh/2+lab.length*LH+14:0);
    P.push({r,ty,dec,bl,rl,il,bh,rh,top:y,cy:y+rh/2,tgt:nm?(+nm[1]-1):null,side,lab}); y+=rh+GAP; });
  const H=y;

  [["Responsibility",RX,"start"],["Flow chart",CX,"middle"],["Interface",IX,"start"]].forEach(([l,x,an])=>{ const w=l.length*8.2; const x0=an==="middle"?x-w/2:x;
    g+=T(x,24,l,`text-anchor="${an}" font-size="15" font-weight="700" fill="#1e293b"`)+`<line x1="${x0}" x2="${x0+w}" y1="29" y2="29" stroke="#1e293b"/>`; });

    if(p.dec && p.tgt!==null && P[p.tgt] && p.tgt!==i){ const q=P[p.tgt], lx=L1-18-(lane++%4)*18, ex=CX-BW/2;
      g+=`<path d="M${CX-BW/2} ${p.cy} H${lx} V${q.cy} H${ex-2}" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#pb)"/>`+T(CX-BW/2-8,p.cy-7,"No",'text-anchor="end" font-size="12" font-weight="700" fill="#b45309"');
      if(p.lab){ const w=140, h=p.lab.length*LH+12, x=Math.max(2,lx-w-8), yy=p.cy+10; g+=`<rect x="${x}" y="${yy}" width="${w}" height="${h}" fill="#fff" stroke="#b45309" stroke-width="1.3"/>`+TL(x+w/2,yy+17,p.lab,LH,'text-anchor="middle" font-size="12" fill="#7c2d12"'); } }
    if(p.dec && p.side){ const w=150, h=p.side.length*LH+16, x=L0-6, yy=p.cy-h/2;
      g+=`<path d="M${CX-BW/2} ${p.cy} H${x+w+2}" stroke="#b45309" stroke-width="1.6" marker-end="url(#pb)"/>`+T(CX-BW/2-8,p.cy-7,"No",'text-anchor="end" font-size="12" font-weight="700" fill="#b45309"');
      g+=`<rect x="${x}" y="${yy}" width="${w}" height="${h}" fill="#fff" stroke="#475569" stroke-width="1.4" stroke-dasharray="3 3"/>`+TL(x+w/2,yy+19,p.side,LH,'text-anchor="middle" font-size="12" fill="#1e293b"'); }
    if(p.dec) g+=`<polygon points="${CX},${bt} ${CX+BW/2},${p.cy} ${CX},${bt+p.bh} ${CX-BW/2},${p.cy}" fill="#fff" stroke="#334155" stroke-width="1.6"/>`;
    else { const fill=p.ty==="key"?"#f6c9cf":p.ty==="start"||p.ty==="end"?"#eef2f7":"#fff", sk=p.ty==="key"?"#9f1239":"#334155";

      cols:[{k:"_n",l:"#",rownum:1},{k:"idea",l:"Idea",ro:1},{k:"p",l:"Payoff",type:"number",w:60},{k:"e",l:"Effort",type:"number",w:60}]},
    {id:"note", q:"What is the decision or next step?", type:"textarea", optional:1}
  ],
  sample:{topic:"Eliminate J3 cracked solder joints",

    rate:[{idea:"Interlock fixture at all cable benches",p:"9",e:"6"},{idea:"Shadow board and shift-start tool check",p:"7",e:"2"},{idea:"Add photo to WI step 14",p:"6",e:"1"},{idea:"Training sign-off in line-transfer checklist",p:"8",e:"3"},{idea:"Retrain all operators",p:"4",e:"3"},{idea:"Redesign to lower-retention connector",p:"7",e:"9"},{idea:"Add J3 wiggle test at final test",p:"7",e:"4"},{idea:"X-ray every J3 joint",p:"3",e:"8"},{idea:"Extra supervisor on night shift",p:"4",e:"7"},{idea:"Handling poster at each bench",p:"2",e:"1"}],
    note:"Start the four Implement items this week; plan the interlock fixture and connector redesign as projects."},
  render(a){
    if(!(a.ideas||[]).length) return String(a.topic||"").trim()?EMPTY("Add the ideas to sort."):EMPTY();
    const d=pickData(a), bad=d.filter(r=>r.p<1||r.p>10||r.e<1||r.e>10);
    const W=620,H=520,L=60,R=16,Tp=16,B=56,pw=W-L-R,ph=H-Tp-B, sx=v=>L+(Math.max(1,Math.min(10,v))-0.5)/10*pw, sy=v=>Tp+ph-(Math.max(1,Math.min(10,v))-0.5)/10*ph;
    const mx=L+pw/2, my=Tp+ph/2;
    let g="";
    [["I",L,Tp],["C",mx,Tp],["P",L,my],["K",mx,my]].forEach(([k,x,y])=>{ const q=PQ[k];
      g+=`<rect x="${x}" y="${y}" width="${pw/2}" height="${ph/2}" fill="${q[3]}"/>`+T(x+12,y+26,q[0].toUpperCase(),`font-size="18" font-weight="800" fill="${q[2]}" opacity=".85"`); });
    g+=`<line x1="${mx}" x2="${mx}" y1="${Tp}" y2="${Tp+ph}" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="${L}" x2="${L+pw}" y1="${my}" y2="${my}" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    g+=`<rect x="${L}" y="${Tp}" width="${pw}" height="${ph}" fill="none" stroke="#94a3b8"/>`;
    for(let v=1;v<=10;v++){ g+=T(sx(v),Tp+ph+16,v,'text-anchor="middle" class="tk"')+T(L-8,sy(v)+4,v,'text-anchor="end" class="tk"'); }
    g+=T(L+pw/2,H-8,"Effort  →  (1 easy · 10 very hard)",'text-anchor="middle" class="al"')+T(16,Tp+ph/2,"Payoff  →",`text-anchor="middle" class="al" transform="rotate(-90 16 ${Tp+ph/2})"`);
    const seen={};
    d.forEach(r=>{ const k=Math.round(r.p)+"|"+Math.round(r.e), j=seen[k]=(seen[k]||0)+1, ang=(j-1)*2.1, rad=j>1?13:0;
      const x=sx(r.e)+Math.cos(ang)*rad, y=sy(r.p)+Math.sin(ang)*rad, c=PQ[r.q][2];
      g+=`<g><title>${esc(r.n+". "+r.idea+" (payoff "+r.p+", effort "+r.e+")")}</title><circle cx="${x}" cy="${y}" r="12" fill="${c}" stroke="#fff" stroke-width="2"/>`+T(x,y+4,r.n,'text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff"')+`</g>`; });
    let h=`<div style="font-weight:700;margin-bottom:4px">${esc(a.topic||"")}</div><svg viewBox="0 0 ${W} ${H}" class="chart" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;

    h+=`<div class="kpis">${["I","C","P","K"].map(k=>kpi(d.filter(r=>r.q===k).length,PQ[k][0])).join("")}</div>`;
    h+=`<div class="pickl">`+["I","C","P","K"].map(k=>{ const rr=d.filter(r=>r.q===k).sort((x,y)=>y.p-x.p||x.e-y.e), q=PQ[k];
      return `<div class="pq" style="border-color:${q[2]};background:${q[3]}"><div class="pqh" style="color:${q[2]}">${q[0]} <span>(${rr.length})</span></div><div class="pqd">${q[1]}</div>${rr.length?`<ol>${rr.map(r=>`<li value="${r.n}">${esc(r.idea)} <small>P${fmtN(r.p)} · E${fmtN(r.e)}</small></li>`).join("")}</ol>`:`<div class="pqd" style="font-style:italic">None</div>`}</div>`; }).join("")+`</div>`;
    const border=d.filter(r=>r.p===5||r.p===6||r.e===5||r.e===6);
    if(border.length) h+=`<div class="find">Borderline (on or next to a centre line): ${border.map(r=>"#"+r.n).join(", ")}. Discuss these rather than relying on the score.</div>`;

/* ===================== state ===================== */
const KEY = "rcakit.v1";
let DB = {}; try{ DB = JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ DB = {}; }
let UI = {}; try{ UI = JSON.parse(localStorage.getItem(KEY+".ui")||"{}")||{}; }catch(e){ UI = {}; }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); localStorage.setItem(KEY+".ui", JSON.stringify(UI)); }catch(e){} }
const blank = () => ({ans:{}, seen:{}, cur:null, done:false, started:false});
function S(id){ return DB[id] || (DB[id]=blank()); }
let curTool = null, choiceTmp = undefined;

const vis = (t,a) => t.steps.filter(s => !s.when || s.when(a));
const qText = (s,a) => typeof s.q==="function" ? s.q(a) : s.q;
const colsOf = (s,a) => typeof s.cols==="function" ? s.cols(a) : s.cols;
function optsOf(s,a){ const o=typeof s.opts==="function"?s.opts(a):s.opts; return o.map(x=>Array.isArray(x)?x:[x,x]); }
function valOf(s,a){
  let v = a[s.id];
  if(v===undefined && s.def) v = s.def(a);
  if(s.type==="table"){ v = Array.isArray(v) ? v : []; if(s.sync) v = s.sync(a,v); if(!v.length) v = Array.from({length:s.minRows||3},()=>({})); }
  return v;
}
function isEmptyVal(s,v,a){
  if(v===undefined||v===null) return true;
  if(s.type==="number") return !Number.isFinite(v);
  if(s.type==="decide") return !v || !v.a;
  if(s.type==="list"||s.type==="numbers"||s.type==="pick") return !v.length;
  if(s.type==="table"){ const cols=colsOf(s,a).filter(c=>!c.ro&&!c.rownum).map(c=>c.k); return !v.some(r=>cols.some(k=>String(r[k]??"").trim()!=="")); }
  return String(v).trim()==="";
}
function stepsDone(t,st){ const v=vis(t,st.ans); return {n:v.filter(s=>st.seen[s.id]).length, of:v.length}; }

/* ===================== answer formatting ===================== */
function fmtAns(s,v,a){
  if(v===undefined||v===null||(Array.isArray(v)&&!v.length)||v==="") return `<i style="opacity:.7">Skipped</i>`;
  switch(s.type){
    case "choice": { const o=optsOf(s,a).find(x=>x[0]===v); return esc(o?o[1]:v); }
    case "decide": return `<b>${v.a==="yes"?"YES":"NO"}</b>${v.b?` — because: ${esc(v.b)}`:""}`;
    case "list": case "pick": return `<ul>${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    case "numbers": return `${v.length} values: ${esc(v.slice(0,10).join(", "))}${v.length>10?" …":""}`;
    case "table": {
      const cols=colsOf(s,a), keep=cols.filter(c=>c.rownum||v.some(r=>String(r[c.k]??"").trim()!==""));
      const rr=v.filter(r=>keep.some(c=>!c.ro&&String(r[c.k]??"").trim()!==""));
      if(!rr.length) return `<i style="opacity:.7">No rows</i>`;
      const show=rr.slice(0,8);
      return `<div class="tscroll"><table class="mt"><tr>${keep.map(c=>`<th>${esc(c.l)}</th>`).join("")}</tr>${show.map((r,ri)=>`<tr>${keep.map(c=>c.rownum?`<td><b>${v.indexOf(r)+1}</b></td>`:`<td>${esc(c.type==="select"&&c.opts?((c.opts.map(o=>Array.isArray(o)?o:[o,o]).find(o=>o[0]===r[c.k])||[0,r[c.k]])[1]):r[c.k])}</td>`).join("")}</tr>`).join("")}</table></div>${rr.length>8?`<div style="font-size:11.5px;opacity:.75">+ ${rr.length-8} more rows</div>`:""}`;
    }
    default: return esc(v).replace(/\n/g,"<br>");
  }
}

/* ===================== input widgets ===================== */
function inputHTML(s,a){
  const v=valOf(s,a), ph=s.ph?` placeholder="${esc(s.ph)}"`:"";
  switch(s.type){
    case "text": return `<input class="inp" data-in${ph} value="${esc(v??"")}">`;
    case "number": return `<input class="inp" type="number" step="any" data-in${ph} value="${Number.isFinite(v)?v:""}">`;
    case "textarea": return `<textarea data-in${ph}>${esc(v??"")}</textarea>`;
    case "pick": { const ops=s.opts(a), sel=new Set(v||[]); if(!ops.length) return `<div class="hint">Nothing to pick yet: go back and add some first.</div>`;
      return `<div class="picks">${ops.map(([grp,o])=>`<label class="pk${sel.has(o)?" on":""}"><input type="checkbox" data-pk value="${esc(o)}"${sel.has(o)?" checked":""}><span>${esc(o)}</span>${grp?`<small>${esc(grp)}</small>`:""}</label>`).join("")}</div>`; }
    case "list": return `<textarea data-in${ph||' placeholder="One item per line"'}>${esc((v||[]).join("\n"))}</textarea>`;
    case "numbers": return `<textarea data-in${ph||' placeholder="e.g. 5.01 5.03 4.99 …"'}>${esc((v||[]).join("  "))}</textarea>`;
    case "decide": { choiceTmp=v&&v.a; return `<div class="choices">${[["yes",s.yes||"Yes"],["no",s.no||"No"]].map(([k,l])=>`<button type="button" class="choice${choiceTmp===k?" on":""}" data-dc="${k}">${esc(l)}</button>`).join("")}</div><textarea data-in style="margin-top:8px;min-height:64px" placeholder="${esc(s.ph||"Because… (the evidence for your answer)")}">${esc(v&&v.b||"")}</textarea>`; }
    case "choice": { choiceTmp=v; return `<div class="choices">${optsOf(s,a).map(([k,l])=>`<button type="button" class="choice${v===k?" on":""}" data-ch="${esc(k)}">${esc(l)}${s.optHelp&&s.optHelp[k]?`<small>${esc(s.optHelp[k])}</small>`:""}</button>`).join("")}</div>`; }
    case "table": {
      const cols=colsOf(s,a);
      let h=`<div class="tscroll"><table class="etbl" data-tbl><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join("")}${s.fixed?"":"<th></th>"}</tr>`;
      v.forEach((r,i)=>{ h+=`<tr data-r="${i}">`+cols.map(c=>{
          if(c.rownum) return `<td class="ro rn">${i+1}</td>`;
          const cv=r[c.k]??"";
          if(c.ro) return `<td class="ro" data-c="${c.k}" data-v="${esc(cv)}">${esc(cv)}</td>`;
          if(c.type==="select") return `<td><select data-c="${c.k}">${c.opts.map(o=>Array.isArray(o)?o:[o,o]).map(([k,l])=>`<option value="${esc(k)}"${String(cv)===String(k)?" selected":""}>${esc(l)}</option>`).join("")}</select></td>`;
          return `<td><input data-c="${c.k}" ${c.type==="number"?'type="number" step="any"':""} value="${esc(cv)}"${c.ph?` placeholder="${esc(c.ph)}"`:""} style="${c.w?`min-width:${c.w}px`:""}"></td>`;
        }).join("")+(s.fixed?"":`<td class="x"><button type="button" class="xb" data-delrow="${i}" title="Remove row">×</button></td>`)+`</tr>`; });
      h+=`</table></div>`;
      if(!s.fixed) h+=`<div class="row" style="margin-top:6px"><button type="button" class="btn sm" data-addrow>+ Add row</button><span class="hint">Tip: you can paste rows copied from Excel into the first cell.</span></div>`;
      return h;
    }
  }
  return "";
}
function readInput(s,a){
  const box=$("#inbox"); if(!box) return a[s.id];
  if(s.type==="choice") return choiceTmp;
  if(s.type==="decide"){ const el=box.querySelector("[data-in]"); return {a:choiceTmp, b:el?el.value.trim():""}; }
  if(s.type==="table"){
    const cols=colsOf(s,a), out=[];
    box.querySelectorAll("tr[data-r]").forEach(tr=>{ const r={};
      cols.forEach(c=>{ const el=tr.querySelector(`[data-c="${c.k}"]`); if(!el) return; r[c.k]= c.ro ? el.dataset.v : el.value.trim(); });
      out.push(r); });
    const ed=cols.filter(c=>!c.ro&&!c.rownum), txt=ed.filter(c=>c.type!=="select"), chk=txt.length?txt:ed;
    return s.fixed ? out : out.filter(r=>chk.some(c=>String(r[c.k]??"").trim()!==""));
  }
  if(s.type==="pick") return [...box.querySelectorAll("[data-pk]:checked")].map(x=>x.value);
  const el=box.querySelector("[data-in]"); if(!el) return undefined;
  const raw=el.value;
  if(s.type==="number") return num(raw);
  if(s.type==="list") return raw.split("\n").map(x=>x.trim()).filter(Boolean);
  if(s.type==="numbers") return parseNums(raw);
  return raw.trim();
}

/* ===================== chat / wizard ===================== */
function renderChat(){
  const t=TOOLS[curTool], st=S(curTool), a=st.ans, steps=vis(t,a), p=stepsDone(t,st);
  let h=`<h3>Step-by-step <span class="prog">${p.n} of ${p.of} answered</span></h3>`;
  h+=`<div class="msg bot"><div class="av">RCA</div><div class="bub">${t.intro?esc(t.intro):`Let's build your <b>${esc(t.name)}</b>.`} I'll ask ${steps.length} short questions, one at a time. Your result builds on the right as you go.</div></div>`;
  if(!st.started){
    h+=`<div class="start"><button class="btn pri" data-act="begin">Start with my own data</button><button class="btn" data-act="sample">Load the sample case</button>${(t.altSamples||[]).map((x,i)=>`<button class="btn" data-alt="${i}">Load ${esc(x.label)}</button>`).join("")}</div>`;
    $("#chat").innerHTML=h; return;
  }
  steps.forEach((s,i)=>{
    const isCur = s.id===st.cur;
    if(!isCur && !st.seen[s.id]) return;
    const ph = s.phase ? `<span class="phase">${esc(s.phase)}</span>` : "";
    const sug = s.tools && s.tools.length ? `<div class="sugg">Helpful tools: ${s.tools.map(x=>chipOf(x)).join("")}</div>` : "";
    h+=`<div class="msg bot"><div class="av">${i+1}</div><div class="bub">${ph}<b class="q">${esc(qText(s,a))}${s.optional?' <span style="font-weight:400;color:var(--mute);font-size:12px">(optional)</span>':""}</b>${isCur&&s.help?`<div class="help">${esc(typeof s.help==="function"?s.help(a):s.help)}</div>`:""}${isCur?sug:""}</div></div>`;
    if(isCur){
      h+=`<div class="inbox" id="inbox" data-step="${s.id}">${inputHTML(s,a)}
        <div class="row"><span class="hint">${s.type==="text"||s.type==="number"?"Press Enter to continue":s.type==="choice"?"Pick one to continue":s.type==="decide"?"Choose Yes or No, give the reason, then Next":s.type==="pick"?"Tick the ones that apply, then Next":"Ctrl + Enter to continue"}</span>
        ${i>0?`<button class="btn ghost sm" data-act="back">← Back</button>`:""}
        ${s.optional?`<button class="btn sm" data-act="skip">Skip</button>`:""}
        ${s.type!=="choice"||a[s.id]!==undefined?`<button class="btn pri sm" data-act="next">${i===steps.length-1?"Finish":"Next →"}</button>`:""}</div></div>`;
    } else {
      h+=`<div class="msg user"><div class="bub">${fmtAns(s,a[s.id],a)}<span class="edit" data-edit="${s.id}">Edit</span></div></div>`;
    }
  });
  if(!st.cur && st.done){
    h+=`<div class="msg bot"><div class="av">✓</div><div class="bub"><b>All done.</b> Your ${esc(t.name)} is complete${t.cat==="fw"?" — the phase report is on the right":" on the right"}. Click <b>Edit</b> on any answer to change it, or <b>Print / PDF</b> to keep a record.${t.next&&t.next.length?`<div class="sugg">Next, consider: ${t.next.map(x=>chipOf(x)).join("")}</div>`:""}</div></div>`;
  }
  $("#chat").innerHTML=h;
}
function renderOut(ans){
  const t=TOOLS[curTool]; const a=ans||S(curTool).ans; let h;
  try{ h=t.render(a); }catch(e){ console.error(e); h=EMPTY("Some answers can't be drawn yet: "+esc(e.message)); }
  $("#out").innerHTML=h;
}
function focusInbox(){ const el=$("#inbox [data-in], #inbox input, #inbox select, #inbox .choice"); if(el){ el.focus({preventScroll:true}); } const b=$("#inbox"); if(b) b.scrollIntoView({block:"nearest",behavior:"smooth"}); }
function saveCurrent(validate){
  const t=TOOLS[curTool], st=S(curTool); if(!st.cur) return true;
  const s=t.steps.find(x=>x.id===st.cur); const v=readInput(s,st.ans);
  if(isEmptyVal(s,v,st.ans)){
    if(validate && !s.optional){ const b=$("#inbox"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); toast("Please answer this one to continue"); return false; }
    delete st.ans[s.id];
  } else st.ans[s.id]=v;
  return true;
}
function advance(fromId){
  const t=TOOLS[curTool], st=S(curTool), steps=vis(t,st.ans);
  st.seen[fromId]=true;
  const i=steps.findIndex(s=>s.id===fromId);
  const nxt = steps.slice(i+1).find(s=>!st.seen[s.id]) || steps.find(s=>!st.seen[s.id]);
  st.cur = nxt ? nxt.id : null; st.done = !nxt;
  // drop answers for steps that are no longer visible
  Object.keys(st.seen).forEach(k=>{ if(!steps.find(s=>s.id===k)) delete st.seen[k]; });
  persist(); renderChat(); renderOut(); renderSide(); setTimeout(focusInbox,30);
}
function chatAct(act){
  const t=TOOLS[curTool], st=S(curTool);
  if(act==="begin"){ st.started=true; st.cur=vis(t,st.ans)[0].id; persist(); renderChat(); focusInbox(); return; }
  if(act==="sample"){ loadSample(); return; }
  if(act==="next"){ if(!saveCurrent(true)) return; advance(st.cur); return; }
  if(act==="skip"){ delete st.ans[st.cur]; advance(st.cur); return; }
  if(act==="back"){ saveCurrent(false); const steps=vis(t,st.ans), i=steps.findIndex(s=>s.id===st.cur); if(i>0){ st.cur=steps[i-1].id; persist(); renderChat(); renderOut(); focusInbox(); } return; }
}
function loadSample(alt){
  const t=TOOLS[curTool], st=S(curTool);
  if(Object.keys(st.seen).length && !confirm("Replace your current answers with the sample case?")) return;
  const a=alt!==undefined&&t.altSamples ? clone(t.altSamples[alt].data) : typeof t.sample==="function"?t.sample():clone(t.sample);
  DB[curTool]={ans:a, seen:{}, cur:null, done:true, started:true};
  vis(t,a).forEach(s=>DB[curTool].seen[s.id]=true);
  persist(); renderChat(); renderOut(); renderSide(); toast("Sample case loaded — edit any answer to try your own");
}

/* chat events */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act],[data-edit],[data-ch],[data-addrow],[data-delrow],[data-open],[data-go],[data-tact],[data-dc],[data-alt],[data-likely]");
  if(el && el.dataset.likely!==undefined && curTool==="fishbone"){ const st=S(curTool), c=el.dataset.likely; let L=(st.ans.likely||[]).slice(); const i=L.findIndex(x=>x.toLowerCase().trim()===c.toLowerCase().trim()); if(i>=0) L.splice(i,1); else L.push(c);
    if(L.length) st.ans.likely=L; else delete st.ans.likely; st.seen.likely=true; persist(); renderChat(); renderOut(); toast(i>=0?"Un-circled: "+c:"Circled as most likely: "+c); return; }
  if(el && el.dataset.dc){ choiceTmp=el.dataset.dc; $$("#inbox [data-dc]").forEach(b=>b.classList.toggle("on",b===el)); const st=S(curTool), s=TOOLS[curTool].steps.find(x=>x.id===st.cur); const tmp=Object.assign({},st.ans); tmp[s.id]=readInput(s,tmp); renderOut(tmp); return; }
  if(el && el.dataset.alt!==undefined){ loadSample(+el.dataset.alt); return; }
  if(!el) return;
  if(el.dataset.open){ go("tool/"+el.dataset.open); return; }
  if(el.dataset.go){ go(el.dataset.go==="home"?"":el.dataset.go); return; }
  if(el.dataset.tact){ const t=TOOLS[curTool]; t.actions[el.dataset.tact](S(curTool).ans); return; }
  if(el.dataset.edit){ const st=S(curTool); saveCurrent(false); st.cur=el.dataset.edit; st.done=false; persist(); renderChat(); renderOut(); focusInbox(); return; }
  if(el.dataset.ch!==undefined){ const st=S(curTool); choiceTmp=el.dataset.ch; st.ans[st.cur]=choiceTmp; advance(st.cur); return; }
  if(el.dataset.addrow!==undefined){ const st=S(curTool), t=TOOLS[curTool], s=t.steps.find(x=>x.id===st.cur); const v=readInput(s,st.ans); v.push({}); st.ans[s.id]=v; renderChat(); focusLastRow(); return; }
  if(el.dataset.delrow!==undefined){ const st=S(curTool), t=TOOLS[curTool], s=t.steps.find(x=>x.id===st.cur);
    const all=[]; const cols=colsOf(s,st.ans); $$("#inbox tr[data-r]").forEach(tr=>{ const r={}; cols.forEach(c=>{ const x=tr.querySelector(`[data-c="${c.k}"]`); if(x) r[c.k]=c.ro?x.dataset.v:x.value; }); all.push(r); });
    const di=+el.dataset.delrow; all.splice(di,1);
    cols.filter(c=>c.stepref).forEach(c=>all.forEach(r=>{ const m=String(r[c.k]??"").trim().match(/^(\d+)(.*)$/); if(!m) return; const n=+m[1];
      if(n===di+1) r[c.k]=""; else if(n>di+1) r[c.k]=String(n-1)+m[2]; })); st.ans[s.id]=all; renderChat(); renderOut(); return; }
  if(el.dataset.act){ const a=el.dataset.act;
    if(["begin","sample","next","skip","back"].includes(a)) chatAct(a);
    else if(a==="restart"){ if(!confirm("Clear all answers for this tool and start again?")) return; DB[curTool]=blank(); persist(); viewTool(curTool); renderSide(); }
    else if(a==="print") window.print();
    else if(a==="full"){ const d=$("#full"); $("#fullT").textContent=TOOLS[curTool].name; $("#fullB").innerHTML=$("#out").innerHTML; d.showModal(); }
    else if(a==="closefull") $("#full").close();
    else if(a==="guide"){ const d=$("#guide"); d.open=!d.open; }
  }
});
function focusLastRow(){ const r=$$("#inbox tr[data-r]").pop(); if(r){ const i=r.querySelector("input,select"); if(i) i.focus(); } }
document.addEventListener("keydown", e=>{
  const box=e.target.closest && e.target.closest("#inbox"); if(!box || e.key!=="Enter") return;
  const s=TOOLS[curTool].steps.find(x=>x.id===S(curTool).cur); if(!s) return;
  if(e.ctrlKey||e.metaKey||((s.type==="text"||s.type==="number") && !e.shiftKey)){ e.preventDefault(); chatAct("next"); }
  else if(s.type==="table" && e.target.tagName==="INPUT"){ e.preventDefault(); chatAct("next"); }
});
let liveT=null;
document.addEventListener("input", e=>{
  if(!e.target.closest || !e.target.closest("#inbox")) return;
  clearTimeout(liveT); liveT=setTimeout(()=>{ const st=S(curTool), t=TOOLS[curTool], s=t.steps.find(x=>x.id===st.cur); if(!s) return;
    const tmp=Object.assign({}, st.ans); const v=readInput(s,tmp); if(!isEmptyVal(s,v,tmp)) tmp[s.id]=v; renderOut(tmp); },220);
});
/* paste a block from Excel into a table */
document.addEventListener("paste", e=>{
  const inp=e.target; if(!inp.closest || !inp.closest("#inbox [data-tbl]") || inp.tagName!=="INPUT") return;
  const txt=(e.clipboardData||window.clipboardData).getData("text"); if(!/[\t\n]/.test(txt.trim())) return;
  e.preventDefault();
  const st=S(curTool), t=TOOLS[curTool], s=t.steps.find(x=>x.id===st.cur), cols=colsOf(s,st.ans), editable=cols.filter(c=>!c.ro&&!c.rownum);
  const tr=inp.closest("tr"), r0=+tr.dataset.r, c0=editable.findIndex(c=>c.k===inp.dataset.c);
  const all=[]; $$("#inbox tr[data-r]").forEach(row=>{ const r={}; cols.forEach(c=>{ const x=row.querySelector(`[data-c="${c.k}"]`); if(x) r[c.k]=c.ro?x.dataset.v:x.value; }); all.push(r); });
  txt.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="").forEach((line,i)=>{
    if(s.fixed && r0+i>=all.length) return;
    const r=all[r0+i] || (all[r0+i]={});
    line.split("\t").forEach((cell,j)=>{ const c=editable[c0+j]; if(c) r[c.k]=cell.trim(); });
  });
  st.ans[s.id]=all; renderChat(); renderOut(Object.assign({},st.ans)); toast("Pasted "+txt.trim().split("\n").length+" rows");
});

/* ===================== views ===================== */
function viewTool(id){
  curTool=id; const t=TOOLS[id], c=CATS[t.cat], st=S(id), g=t.guide;
  const gOpen = UI["g_"+id]===undefined ? true : UI["g_"+id];
  $("#view").innerHTML=`
  <div class="thead"><div class="big" style="background:${c.bg};color:${c.color}">${esc(t.icon)}</div>
    <div style="flex:1;min-width:240px"><div><span class="tag" style="background:${c.bg};color:${c.color}">${esc(c.short)}</span></div><h1>${esc(t.name)}</h1><div class="meta">${esc(t.short)}</div></div>
    <div class="acts"><button class="btn" data-act="sample">Load sample</button>${(t.altSamples||[]).map((x,i)=>`<button class="btn" data-alt="${i}">Load ${esc(x.label)}</button>`).join("")}<button class="btn" data-act="restart">Start over</button><button class="btn" data-act="print">Print / PDF</button></div></div>
  <div class="tgrid">
    <div>
      <details class="card guide" id="guide"${gOpen?" open":""}><summary>Guide — what it is, when to use it, how</summary><div class="gb">
        <div class="what">${g.what}</div>
        ${g.when?`<h4>When to use it</h4><ul>${g.when.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
        ${g.steps?`<h4>${t.cat==="fw"?"Phases":"How to do it"}</h4><ol>${g.steps.map(x=>`<li>${x}</li>`).join("")}</ol>`:""}
        ${g.tips?`<h4>Tips and traps</h4><ul>${g.tips.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
        ${t.related&&t.related.length?`<h4>Works with</h4><div class="sugg" style="margin:0">${t.related.map(x=>chipOf(x)).join("")}</div>`:""}
        ${t.sampleNote?`<h4>Sample case</h4><div>${t.sampleNote}</div>`:""}
      </div></details>
      <div class="card chat" id="chat"></div>
    </div>
    <div class="rcol"><div class="card out"><h3>Result <span style="margin-left:auto;font:600 11.5px var(--sans);text-transform:none;letter-spacing:0;color:var(--mute)">${esc(t.resultLabel||"")}</span><button class="btn sm" data-act="full" title="Open the result full screen">⤢ Full view</button></h3><div id="out"></div></div></div>
  </div>`;
  $("#guide").addEventListener("toggle", e=>{ UI["g_"+id]=e.target.open; persist(); });
  if(st.started && !st.cur && !st.done){ const f=vis(t,st.ans).find(s=>!st.seen[s.id]); st.cur=f?f.id:null; st.done=!f; }
  renderChat(); renderOut();
}

function viewHome(){
  curTool=null;
  const COLS=[["Define & expose","What exactly is wrong, where, how big?"],["Analyze the cause","Why does it happen?"],["Solve & implement","Fix it and make the change happen"],["Verify & sustain","Prove it worked and keep it fixed"]];
  const FW=[
    ["eas","EAS","Expose · Analyze · Solve",[[1,1,"E · Expose the problem"],[2,1,"A · Analyze the problem"],[3,2,"S · Solve the problem (fix, verify, standardize)"]]],
    ["pdca","PDCA","Deming cycle",[[1,2,"P · Plan (problem, root cause, action plan)"],[3,1,"D · Do (implement or pilot)"],[4,1,"C · Check  ·  A · Act"]]],
    ["dmaic","DMAIC","Six Sigma",[[1,1,"D · Define  ·  M · Measure"],[2,1,"A · Analyze"],[3,1,"I · Improve"],[4,1,"C · Control"]]],
    ["8d","8D","Eight disciplines",[[1,1,"D0–D3 · Prepare, team, describe, contain"],[2,1,"D4 · Root cause (occurrence & escape)"],[3,1,"D5–D6 · Choose, implement, validate fix"],[4,1,"D7–D8 · Prevent recurrence, close"]]],
    ["bs62740","BS EN 62740","RCA standard (IEC 62740)",[[1,1,"1 · Initiation  ·  2 · Establishing facts"],[2,1,"3 · Analysis  ·  4 · Validation"],[3,2,"5 · Presentation of results → actions handed to CAPA / 8D"]]]
  ];
  const TC=[["flowchart","checksheet","pareto","histogram","controlchart","stratification"],["fishbone","cmv","fivewhy","fta","window","scatter","stratification"],["pickchart","weighting","forcefield","window"],["controlchart","pareto","checksheet","histogram"]];
  let ig=`<div class="ig"><div></div>${COLS.map((c,i)=>`<div class="ch c${i+1}">${i+1}. ${esc(c[0])}<small>${esc(c[1])}</small></div>`).join("")}`;
  FW.forEach(([id,n,sub,ph],r)=>{ ig+=`<div class="rl" data-open="${id}" style="grid-row:${r+2}"><div>${n}<small>${sub}</small></div></div>`;
    ph.forEach(([c,span,l])=>{ ig+=`<div class="ph" data-open="${id}" style="grid-row:${r+2};grid-column:${c+1} / span ${span}">${esc(l)}</div>`; }); });
  ig+=`<div class="rl" style="grid-row:${FW.length+2};cursor:default"><div>Tools<small>used in each stage</small></div></div>`;
  TC.forEach((list,i)=>{ ig+=`<div class="tcell" style="grid-row:${FW.length+2};grid-column:${i+2}">${list.map(x=>chipOf(x)).join("")}</div>`; });
  ig+=`</div>`;
  const legend=`<div class="legend">${Object.entries(CATS).map(([k,c])=>`<span><i style="background:${c.color}"></i>${esc(c.name)}</span>`).join("")}<span style="color:var(--mute)">Click any phase or tool to open it.</span></div>`;
  let igm=`<div class="igm">`;
  COLS.forEach((c,si)=>{ const col=si+1;
    igm+=`<div class="igs"><div class="ch c${col}">${col}. ${esc(c[0])}<small>${esc(c[1])}</small></div><div class="igb">`;
    FW.forEach(([id,n,sub,ph])=>{ const hit=ph.find(([cc,span])=>col>=cc&&col<cc+span); if(!hit) return;
      const cont=col>hit[0]; igm+=`<div class="igr" data-open="${id}"><b>${esc(n)}</b><span>${cont?"↳ continued: ":""}${esc(hit[2])}</span></div>`; });
    igm+=`<div class="igt">${TC[si].map(x=>chipOf(x)).join("")}</div></div></div>`;
    if(si<COLS.length-1) igm+=`<div class="igarr">▼</div>`; });
  igm+=`</div>`;

  const cats=Object.entries(CATS).map(([k,c])=>`<div class="catc" style="border-color:${c.color};background:${c.bg}"><h3 style="color:${c.color}">${esc(c.name)}</h3><div class="q" style="color:${c.color}">“${esc(c.q)}”</div><p>${esc(c.desc)}</p><div class="chips">${TOOL_ORDER.filter(id=>TOOLS[id].cat===k).map(id=>chipOf(id)).join("")}</div></div>`).join("");

  const CH=[["flowchart","Map the process and its handoffs"],["checksheet","Count defects at the source"],["pareto","Pick the biggest problem"],["stratification","Find which shift, line or lot"],["fishbone","List every possible cause"],["fivewhy","Drill one chain to the root"],["fta","…or map combined causes"],["window","…or classify a people/standard cause"],["forcefield","Plan the change"],["controlchart","Prove it stays fixed"]];
  const chain=`<div class="chain">${CH.map(([id,l],i)=>`${i?'<span class="ar">→</span>':""}<div class="step">${chipOf(id)}<small>${esc(l)}</small></div>`).join("")}</div>`;

  const PICK=[["Who does what in our RCA process, and which tool is used?","procedure"],["Is the cause variation, a mistake, or complexity, and from which M?","cmv"],["Which fix ideas are quick wins, and which should we drop?","pickchart"],["Which of several solutions should we choose?","weighting"],["Where in the process is the defect created or missed?","flowchart"],["How often does each defect happen, and when?","checksheet"],["Which problem should we attack first?","pareto"],["Is the process centred and within spec?","histogram"],["Is the process stable, or did something change?","controlchart"],["Is the problem concentrated in one shift, machine or lot?","stratification"],["Are two variables related?","scatter"],["What could possibly be causing it?","fishbone"],["What is the chain from symptom to root cause?","fivewhy"],["Do several causes have to combine? Which combinations matter?","fta"],["Was the standard missing, not communicated, or not followed?","window"],["What will help or block the fix from being adopted?","forcefield"]];
  const pick=`<div class="pick">${PICK.map(([q,id])=>`<div><span>${esc(q)}</span>${chipOf(id)}</div>`).join("")}</div>`;
  const FWP=[["pdca","PDCA","Small, quick improvements and repeated test cycles."],["eas","EAS","Everyday shop-floor problems; easy for any team to follow."],["8d","8D","Customer complaints, field failures and escapes that need containment and a formal report."],["dmaic","DMAIC","Chronic, data-heavy process problems where the cause is unclear."],["bs62740","BS EN 62740","Serious incidents or audits that need a defensible investigation to a recognised standard; actions go to CAPA / 8D."]];
  const fwp=`<div class="fwpick">${FWP.map(([id,n,d])=>`<div data-open="${id}"><b>${n}</b>${esc(d)}</div>`).join("")}</div>`;

  $("#view").innerHTML=`
  <div class="hero"><h1>Root Cause Analysis Toolkit</h1><p>Every problem-solving framework follows the same four stages. The <b>framework</b> gives you the roadmap; the <b>7 QC tools</b> expose the problem with data; the <b>root-cause methods</b> find why; and the <b>change tools</b> make the fix stick. Each tool asks you one question at a time and comes with a worked sample case: cracked J3 connector joints on a logging-tool PCBA.</p><div class="hcred"><span>Developed by <b>Soe Moe</b> · <a href="mailto:soe.moe@halliburton.com">soe.moe@halliburton.com</a></span><span>Course conductor: <b>Chang Keen Weng</b> (ACT, QC Tools)</span></div></div>
  <div class="panel"><h2>How the frameworks and tools fit together</h2><p class="sub"><span class="dsk">Read across: each framework's phases line up with the same four stages. Read down: the tools that do the work in each stage.</span><span class="mob">Every framework passes through the same four stages. Under each stage: what each framework calls it, and the tools that do the work.</span></p><div class="igwrap">${ig}</div>${igm}${legend}</div>
  <div class="panel"><h2>Four categories</h2><p class="sub">Categorize by the question the tool answers.</p><div class="cats">${cats}</div></div>
  <div class="panel"><h2>A typical investigation, linked end to end</h2><p class="sub">The sample case follows this chain. Open the tools in order to see how each output feeds the next.</p>${chain}</div>
  <div class="panel"><h2>Which framework?</h2><p class="sub">Choose one roadmap per problem.</p>${fwp}</div>
  <div class="panel"><h2>Which tool answers my question?</h2>${pick}</div>`;
}

function renderSide(){
  const h=location.hash.replace(/^#\/?/,"");
  let s=`<div class="nav-home${!h?" on":""}" data-go="home">⌂ Overview & infographic</div>`;
  Object.entries(CATS).forEach(([k,c])=>{
    s+=`<div class="ncat" style="color:${c.color}"><i style="background:${c.color}"></i>${esc(c.name)}</div>`;
    TOOL_ORDER.filter(id=>TOOLS[id].cat===k).forEach(id=>{ const t=TOOLS[id], st=DB[id];
      const p=st&&st.started?stepsDone(t,st):null; const stx=!p?"":st.done?'<span class="st done">✓</span>':`<span class="st">${p.n}/${p.of}</span>`;
      s+=`<div class="ni${h==="tool/"+id?" on":""}" data-open="${id}"><span class="ic" style="background:${c.bg};color:${c.color}">${esc(t.icon)}</span>${esc(t.name)}${stx}</div>`; });
  });
  s+=`<div class="sidefile"><button class="btn sm" onclick="document.getElementById('bExport').click()">Save all</button><button class="btn sm" onclick="document.getElementById('bImport').click()">Open file</button></div>`;
  $("#side").innerHTML=s;
}
function go(h){ location.hash = h ? "#/"+h : "#/"; }
function route(){
  const fd=$("#full"); if(fd&&fd.open) fd.close();
  const h=location.hash.replace(/^#\/?/,"");
  const m=h.match(/^tool\/(.+)$/);
  if(m && TOOLS[m[1]]) viewTool(m[1]); else viewHome();
  renderSide(); $("#side").classList.remove("open"); window.scrollTo({top:0});
}
addEventListener("hashchange", route);

/* ===================== top bar ===================== */
$("#bMenu").onclick=()=>$("#side").classList.toggle("open");
$("#bPrint").onclick=()=>window.print();
$("#bExport").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"rca-toolkit",version:1,saved:new Date().toISOString(),data:DB},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="RCA_toolkit_"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast("Saved all tools to a file");
};
$("#bImport").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(o.app!=="rca-toolkit"||!o.data) throw new Error("not a toolkit file");
    if(!confirm("Replace all current entries with the ones in this file?")) return; DB=o.data; persist(); route(); toast("Opened "+f.name); }
    catch(err){ toast("Cannot open: "+err.message); } }; r.readAsText(f); };

/* tool-specific buttons inside results */
function sendTo(id, ans){ const t=TOOLS[id]; DB[id]={ans, seen:{}, cur:null, done:true, started:true}; vis(t,ans).forEach(s=>DB[id].seen[s.id]=true);
  const nxt=vis(t,ans).find(s=>isEmptyVal(s,ans[s.id],ans)&&!s.optional); if(nxt){ DB[id].cur=nxt.id; DB[id].done=false; delete DB[id].seen[nxt.id]; }
  persist(); go("tool/"+id); }

route();

</script>
